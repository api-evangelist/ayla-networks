paths:
  /rules/bulk.json:
    post:
      summary: Create rules in bulk
      description: 'This API creates new rules in bulk. Devices specified in the rule must exist. The caller must own, or have rights to, the device.


        Parameter description:

        - **name**: Rule name.(*mandatory*)

        - **description**: User given description of this rule.

        - **expression**: Expression of a logical statement about relationship between the entities. This field must contain an expression conforming to Ayla Rule Expression Syntax. Expressions always evaluate to true or false. If they evaluate to true, the rule performs the associated action(s).(*mandatory*)

        ** Example expressions**:

        - "DATAPOINT(dsn1,prop1) < 60"

        - "CONNECTION(DSN0000000120,online) || CONNECTION(DSN0000000120,offline) || CONNECTION(DSN0000000120,all)"

        - "ACTIVATION(DSN0000000120,activated) || ACTIVATION(DSN0000000120,deactivated)"

        - **action_ids**: List of action UUID(s) for the action(s) to be associated with a rule.'
      operationId: create-rules-in-bulk
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
                  format: json
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Created:
                  summary: Created
                  value:
                    rules:
                    - rule_uuid: 7e597480-4d20-11f1-bdfe-43dd63608803
                      name: Blue LED OFF Rule
                      expression: DATAPOINT(AC000W000340333,Blue_LED) == 0
                      is_enabled: true
                      is_abstract: false
                      is_template: false
                      action_ids:
                      - 4633da41-4d03-11f1-b2b0-d1744a9d4c09
                      parameters: {}
                      user_uuid: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      created_at: '2026-05-11T10:02:18.214Z'
                      updated_at: '2026-05-11T10:02:18.214Z'
                      created_by: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      updated_by: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      facility_uuid: ''
                    - rule_uuid: 7e89d350-4d20-11f1-bdfe-43dd63608803
                      name: Blue LED ON Rule
                      expression: DATAPOINT(AC000W000340333,Blue_LED) == 1
                      is_enabled: true
                      is_abstract: false
                      is_template: false
                      action_ids:
                      - 4633da41-4d03-11f1-b2b0-d1744a9d4c09
                      parameters: {}
                      user_uuid: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
