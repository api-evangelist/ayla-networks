  /rules/devices.json:
    get:
      summary: Get rule devices
      description: This API returns an array of all the device DSNs that appear in all your rule expressions. If a DSN does not appear in a rule expression, but does appear as a parameter in an action associated with a rule, the API does not include the DSN in the list of device DSNs.
      operationId: get-rule-devices
      parameters:
      - name: paginated
        in: query
        description: true or 1 means results will be paginated.
        schema:
          type: boolean
      - name: per_page
        in: query
        description: Maximum number of records per page.
        schema:
          type: string
      - name: page
        in: query
        description: One-based number of page to return.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    next_page: 2
                    start_count_on_page: 0
                    total: 198
                    devices:
                    - AC000W000000586
                    - AC000W000000647
                    - AC000W000000719
                    - AC000W000000865
                    - AC000W000000888
                    end_count_on_page: 4
                    current_page_number: 1
              schema:
                type: object
                properties:
                  next_page:
                    type: integer
                    example: 2
                    default: 0
                  start_count_on_page:
                    type: integer
                    example: 0
                    default: 0
                  total:
                    type: integer
                    example: 198
                    default: 0
                  devices:
                    type: array
                    items:
                      type: string
                      example: AC000W000000586
                  end_count_on_page:
                    type: integer
                    example: 4
                    default: 0
                  current_page_number:
                    type: integer
                    example: 1
                    default: 0
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Rules
