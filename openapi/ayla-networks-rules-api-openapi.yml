                      created_by: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      updated_by: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      facility_uuid: ''
          description: Created
        '400':
          content: {}
          description: Bad Request
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
