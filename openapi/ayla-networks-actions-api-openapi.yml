    post:
      summary: Create actions in bulk
      description: 'This API creates new actions in bulk.


        **NOTE**: If create operation fails for any of the actions in the request, execution of request will be interrupted, and all the new actions that might have been created as the result of the request will be deleted (rolled back).


        Parameter description:

        - **name**: User given name to the action.(*mandatory*)

        - **type**: User given action type (AMS_EMAIL, AMS_PUSH, AMS_SMS). Refer Get action types.(*mandatory*)

        - **parameters**: Contains key / value pairs with information relevant to the action to be performed.

        - **Example**: DATAPOINT action

        Required parameter: ''datapoint''

        "parameters": {

        "datapoint": "DATAPOINT(VD72f801390000023, Blue_LED) = true"

        }


        - **Example**: URL parameter

        Required parameter: ''datapoint''

        "parameters": {

        "body": "This is url action body",

        "endpoint": "https://exampleurllink.com"

        }


        - **Example**: DIAGNOSTIC Action

        Required parameter: ''datapoint''

        "parameters": {

        "diagnostc_state_name": "red"

        }

        - **name**: User given name to the action.

        - **rule_ids**: UUID(s) of the rule(s) to be associated with the action.

        - **destination_ids**: Destination UUID(s) to be associated with the action.'
      operationId: create-actions-in-bulk
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
                  format: json
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value:
                    actions:
                    - action_uuid: e2385080-4d06-11f1-a43f-8d73c67c3a12
                      name: Blue LED OFF Actions
                      user_uuid: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      type: DATAPOINT
                      is_abstract: false
                      parameters:
                        datapoint: DATAPOINT(AC000W000340333,Blue_LED) = 0
                      rule_ids: []
                      created_at: '2026-05-11T06:58:58.765Z'
                      updated_at: '2026-05-11T06:58:58.765Z'
                      created_by: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      updated_by: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      oem: 0dfc7900
                    - action_uuid: e2646990-4d06-11f1-a43f-8d73c67c3a12
                      name: Blue LED ON Actions
                      user_uuid: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      type: DATAPOINT
                      is_abstract: false
                      parameters:
                        datapoint: DATAPOINT(AC000W000340333,Blue_LED) = 1
                      rule_ids: []
                      created_at: '2026-05-11T06:58:58.961Z'
                      updated_at: '2026-05-11T06:58:58.961Z'
