      summary: Delete actions in bulk
      description: This API deletes actions in bulk, but it does not delete rules associated with the action.
      operationId: delete-actions-in-bulk
      parameters:
      - name: ids
        in: query
        description: Array of action identifiers. Max 10 entries are allowed.
        schema:
          type: array
          items:
            type: string
      responses:
        '204':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                No Content:
                  summary: No Content
                  value: '{}'
          description: No Content
        '401':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value: '{}'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                type: object
                properties: {}
