                      provision_key: null
                      user_uuid: null
                      user_role: null
                      dealer_uuid: null
                      facility_uuids: []
                    previous_page: null
                    next_page: 2
                    current_page_number: 1
                    start_count_on_page: 1
                    end_count_on_page: 10
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 2
                    default: 0
                  filters:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 4827
                          default: 0
                        name:
                          type: string
                          example: DeviceFilterTestNew
                        description:
                          type: string
                        attributes:
                          type: string
                        dsns:
                          type: object
                          properties:
                            match:
                              type: array
                              items:
                                type: string
                                example: AC000W000340384
                            include:
                              type: array
                              items:
                                type: object
                                properties: {}
                            exclude:
                              type: array
                              items:
                                type: object
                                properties: {}
                        properties:
                          type: array
                          items:
                            type: object
                            properties: {}
                        status:
                          type: string
                        oem:
                          type: string
                          example: 0dfc7900
                        oem_model:
                          type: string
                          example: AylaShield
                        device_metadata:
                          type: string
                        created_at:
                          type: string
                          example: 2020-02-26T06:56:51+0000
                        updated_at:
                          type: string
                          example: 2020-02-26T06:58:27+0000
                        filter_metadata:
                          type: array
                          items:
                            type: object
                            properties: {}
                        oem_version:
                          type: string
                          example: demo_msg-spi-2.1
                        match_oem_version:
                          type: boolean
                          example: true
                          default: true
                        provision_key:
                          type: string
                        user_uuid:
                          type: string
                        user_role:
                          type: string
                        dealer_uuid:
                          type: string
                        facility_uuids:
                          type: array
                          items:
                            type: object
                            properties: {}
                  previous_page:
                    type: string
                  next_page:
                    type: integer
                    example: 2
                    default: 0
                  current_page_number:
                    type: integer
                    example: 1
                    default: 0
                  start_count_on_page:
                    type: integer
                    example: 1
                    default: 0
                  end_count_on_page:
                    type: integer
                    example: 10
                    default: 0
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
