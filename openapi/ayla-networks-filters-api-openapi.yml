openapi: 3.2.0
info:
  title: iot-command-center Filters API
  version: '1.0'
servers:
- url: https://icc-dev.aylanetworks.com/icc/v1/
security:
- sec0: []
tags:
- name: Filters
paths:
  /filters:
    post:
      summary: Create filter
      description: 'This API creates a device filter.


        | Field | Necessity | Description |

        |--|--|--|

        | attributes | optional | List of data objects |

        | device_metadata | optional | List of device metadata objects |

        | description | optional | Brief description of the filter |

        | dsns | optional | Array of DSNs


        {

        “match”: [“dsn1”],

        “include”: [“dsn2”],

        “exclude”: [“dsn3”]

        }

        |

        | filter_metadata | optional | List of filter metadata objects |

        | name | required | Filter name |

        | oem_model | required | OEM model name |

        | oem_version | optional | OEM version number |

        | properties | optional | List of properties data objects |

        | status | optional | List of status objects |'
      operationId: create-filter
      parameters:
      - name: oem
        in: query
        description: Unique OEM identifier.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
                  format: json
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: 300846
                    name: TestFileter33
                    description: null
                    attributes: null
                    dsns:
                      match:
                      - TESTDSN_753877_001
                      - TESTDSN_164527_000
                      include: []
                      exclude: []
                    properties: []
                    status: null
                    oem: 0dfc7900
                    oem_model: ledevb
                    device_metadata: null
                    created_at: 2026-04-29T07:25:51+0000
                    updated_at: 2026-04-29T07:25:51+0000
                    filter_metadata: []
                    oem_version: null
                    match_oem_version: true
                    provision_key: null
                    user_uuid: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                    user_role: Ayla::Admin
                    dealer_uuid: null
                    facility_uuids: []
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 300846
                    default: 0
                  name:
                    type: string
                    example: TestFileter33
                  description:
                    type: string
                  attributes:
                    type: string
                  dsns:
                    type: object
                    properties:
                      match:
                        type: array
                        items:
                          type: string
                          example: TESTDSN_753877_001
                      include:
                        type: array
                        items:
                          type: object
                          properties: {}
                      exclude:
                        type: array
                        items:
                          type: object
                          properties: {}
                  properties:
                    type: array
                    items:
                      type: object
                      properties: {}
                  status:
                    type: string
                  oem:
                    type: string
                    example: 0dfc7900
                  oem_model:
                    type: string
                    example: ledevb
                  device_metadata:
                    type: string
                  created_at:
                    type: string
                    example: 2026-04-29T07:25:51+0000
                  updated_at:
                    type: string
                    example: 2026-04-29T07:25:51+0000
                  filter_metadata:
                    type: array
                    items:
                      type: object
                      properties: {}
                  oem_version:
                    type: string
                  match_oem_version:
                    type: boolean
                    example: true
                    default: true
                  provision_key:
                    type: string
                  user_uuid:
                    type: string
                    example: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                  user_role:
                    type: string
                    example: Ayla::Admin
                  dealer_uuid:
                    type: string
                  facility_uuids:
                    type: array
                    items:
                      type: object
                      properties: {}
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Filters
    get:
      summary: Get filters
      description: This API returns a list of filters.
      operationId: get-filters
      parameters:
      - name: oem
        in: query
        description: Unique OEM identifier.
        schema:
          type: string
      - name: oem_model
        in: query
        description: OEM model.
        schema:
          type: string
      - name: page
        in: query
        description: One-based number of page to return.
        schema:
          type: string
      - name: per_page
        in: query
        description: Max number of records per page.
        schema:
          type: string
      - name: sort_by
        in: query
        description: Field name on which to sort.
        schema:
          type: string
      - name: direction
        in: query
        description: Ascending or descending.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    total: 2
                    filters:
                    - id: 4827
                      name: DeviceFilterTestNew
                      description: null
                      attributes: null
                      dsns:
                        match:
                        - AC000W000340384
                        include: []
                        exclude: []
                      properties: []
                      status: null
                      oem: 0dfc7900
                      oem_model: AylaShield
