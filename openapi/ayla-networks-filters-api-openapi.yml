  /filters/preview:
    post:
      summary: Preview filter
      description: This API creates a temporary filter and returns an array of fitting device objects.
      operationId: preview-filter
      parameters:
      - name: oem
        in: query
        description: Unique OEM identifier.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of entries to be returned. Minimum=0. Maximum=100.
        schema:
          type: string
          default: '10'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - oem_model
              - name
              properties:
                oem_model:
                  type: string
                  description: OEM model name.
                oem_version:
                  type: string
                  description: OEM version.
                name:
                  type: string
                  description: Name of the filter.
                description:
                  type: string
                  description: Description of the filter.
                dsn:
                  properties:
                    match:
                      type: array
                      description: An array of DSNs.
                      items:
                        type: string
                    include:
                      type: array
                      description: Additional DSNs to include.
                      items:
                        type: string
                    exclude:
                      type: array
                      description: Specific DSNs to exclude.
                      items:
                        type: string
                  required: []
                  type: object
                  description: Device Serial Number (DSN) object.
                properties:
                  properties:
                    key:
                      type: string
                      description: Name of the property.
                    value:
                      type: string
                      description: Property key value.
                    op:
                      type: string
                      description: Operation can be any one of the following:<br> !=, <=, ==, >=, contain, does_not_contain.
