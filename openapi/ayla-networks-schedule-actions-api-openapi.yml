openapi: 3.2.0
info:
  title: device-service Schedule Actions API
  version: '1.0'
servers:
- url: https://ads-dev.aylanetworks.com/apiv1/
security:
- sec0: []
tags:
- name: Schedule Actions
paths:
  /schedule_actions/{scheduleActionId}.json:
    put:
      summary: Update schedule action
      description: 'This API creates a schedule action.

        *NOTE*: Specify value to just one of the following parameters in the request body: in_range, at_start, or at_end.'
      operationId: update-schedule-action
      parameters:
      - name: scheduleActionId
        in: path
        description: Unique schedule action identifier.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule_action:
                  properties:
                    name:
                      type: string
                      description: The name of the property this schedule_action is related with.
                    type:
                      type: string
                      description: The schedule action type. Currently only the "SchedulePropertyAction" type is supported.
                      default: SchedulePropertyAction
                    base_type:
                      type: string
                      description: 'Base type can be any one of the following: “string”, “integer”, “boolean”, or “decimal”.'
                    in_range:
                      type: boolean
                      description: Fire schedule action if the time is within the range specified.
                    at_start:
                      type: boolean
                      description: Fire schedule action if the time is at the start of the range.
                    at_end:
                      type: boolean
                      description: Fire schedule action if the time is at the end of the range.
                    value:
                      type: string
                      description: Value to be set to the property when an event fires.
                    active:
                      type: string
                      description: This parameter is used for pausing and resuming the schedule action. Default value if true.
                  required: []
                  type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    schedule_action:
                      active: true
                      at_end: false
                      at_start: true
                      base_type: string
                      in_range: false
                      name: oem_host_version
                      schedule_id: 35961706
                      type: SchedulePropertyAction
                      key: 36290710
                      value: v3
              schema:
                type: object
                properties:
                  schedule_action:
                    type: object
                    properties:
                      active:
                        type: boolean
                        example: true
                        default: true
                      at_end:
                        type: boolean
                        example: false
                        default: true
                      at_start:
                        type: boolean
                        example: true
                        default: true
                      base_type:
                        type: string
                        example: string
                      in_range:
                        type: boolean
                        example: false
                        default: true
                      name:
                        type: string
                        example: oem_host_version
                      schedule_id:
                        type: integer
                        example: 35961706
                        default: 0
                      type:
                        type: string
                        example: SchedulePropertyAction
                      key:
                        type: integer
                        example: 36290710
                        default: 0
                      value:
                        type: string
                        example: v3
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Schedule Actions
    get:
      summary: Get schedule action by ID
      description: This API returns a schedule action.
      operationId: get-schedule-action-by-id
      parameters:
      - name: scheduleActionId
        in: path
        description: Unique schedule action identifier (Schedule action key).
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    schedule_action:
                      active: true
                      at_end: false
                      at_start: true
                      base_type: string
                      in_range: false
                      name: oem_host_version
                      schedule_id: 35961706
                      type: SchedulePropertyAction
                      key: 36290710
                      value: v2
              schema:
                type: object
                properties:
                  schedule_action:
                    type: object
                    properties:
                      active:
                        type: boolean
                        example: true
                        default: true
                      at_end:
                        type: boolean
                        example: false
                        default: true
                      at_start:
                        type: boolean
                        example: true
                        default: true
                      base_type:
                        type: string
                        example: string
                      in_range:
                        type: boolean
                        example: false
                        default: true
                      name:
                        type: string
                        example: oem_host_version
                      schedule_id:
                        type: integer
                        example: 35961706
                        default: 0
                      type:
                        type: string
                        example: SchedulePropertyAction
                      key:
                        type: integer
                        example: 36290710
                        default: 0
                      value:
                        type: string
                        example: v2
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Schedule Actions
    delete:
      summary: Delete schedule action
      description: This API deletes a schedule action.
      operationId: delete-schedule-action-by-id
      parameters:
      - name: scheduleActionId
        in: path
        description: Unique schedule action identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: OK
        '401':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value: '{}'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Not Found:
                  summary: Not Found
                  value: '{}'
          description: Not Found
      deprecated: false
      tags:
      - Schedule Actions
