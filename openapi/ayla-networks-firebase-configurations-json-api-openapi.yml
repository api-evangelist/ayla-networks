    get:
      summary: Get Firebase configuration (Deprecated)
      description: This API is used to fetch Firebase configurations.
      operationId: update-firebase-configuration-1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: array
                  description: An array of API Keys.
                  items:
                    type: string
                app_id:
                  type: array
                  description: An array of Ayla app IDs.
                  items:
                    type: string
                oem_id:
                  type: array
                  description: An array of OEM IDs. This is only for Ayla::Admin.
                  items:
                    type: string
                paginated:
                  type: boolean
                  description: true or 1 means results will be paginated.
                page:
                  type: integer
                  description: Page number.
                  format: int32
                per_page:
                  type: integer
                  description: Maximum number of records per page.
                  format: int32
