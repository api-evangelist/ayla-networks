paths:
  /firebase_configurations.json:
    post:
      summary: Create Firebase configuration (Deprecated)
      description: This API is used to create Firebase configuration.
      operationId: create-firebase-configuration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - api_key
              - url_prefix
              - app_id
              properties:
                apn:
                  type: string
                  description: Android Package Name that you get after registering on firebase console. Optional for iOS
                ibi:
                  type: string
                  description: iOS Bundle ID that you get after registering on firebase console.
                api_key:
                  type: string
                  description: API Key for the app.
                url_prefix:
                  type: string
                  description: URL prefix of the dynamic link.
                app_id:
                  type: string
                  description: Ayla application ID.
                oem_id:
                  type: string
                  description: If "oem_id" is not provided, the current user oem will be considered.
                isi:
                  type: string
                  description: Your application's App Store ID (iPhone app store id).
            examples:
              Example response:
                value:
                  uuid: e4e9a33c-gh36-19eh-2927-6527as251722
                  api_key: REDACTED_GOOGLE_API_KEY
                  apn: com.example.android
                  ibi: com.example.ios
                  link: https://aylanetworks.page.link
                  app_name: SmartTouch
                  isi: 1523593852
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '401':
          description: '401'
          content:
