paths:
  /collections_2.json:
    post:
      summary: Create group or scene
      description: 'This API is used to create a group or scene.


        Use the parameter "type" to specify whether you want to create a group or scene.

        ("type": "GROUP" or "type": "SCENE").


        The following section provides brief descriptions for a Group and a Scene:


        **Group**: A group is a collection of devices that can be viewed and controlled as a single entity. The devices in a group are of a similar type, or have common attributes (e.g. On/Off) that can be controlled as a whole. Groups enable the users to perform a single action to a collection of devices at the same time.


        **Scene**: A scene is a collection of devices with different actions/states. A scene allows us to perform various actions to different types of devices at the same time. When a scene is activated, a set of pre-defined actions are performed on all the devices associated with a scene. A scene is activated manually (tapping a button in the mobile app), or can be automated based on a schedule.


        **NOTE**: In general, a group or scene is referred to as a collection.'
      operationId: create-group-1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
                  format: json
      responses:
        '201':
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    collection_uuid:
                      type: string
                      example: f64ce632-xxxxx-b772-fdfd6de88f54
                    name:
                      type: string
                      example: API Testing
                    type:
                      type: string
                      example: GROUP
                    devices:
                      type: array
                      items:
                        type: object
                        properties:
                          dsn:
                            type: string
                            example: AC000W000458392
                          product_name:
                            type: string
                            example: Ayla Devkit
                          oem_model:
                            type: string
                            example: AylaShield
                          lan_enabled:
                            type: boolean
                            example: false
                            default: true
                          connected_at:
                            type: string
                            example: '2026-05-06T07:57:37Z'
                          connection_status:
                            type: string
                            example: Offline
                    child_collections:
                      type: array
                      items:
                        type: object
                        properties:
                          collection_uuid:
                            type: string
                            example: 0387b969-xxxx-a283-27c89cbfc55c
                          name:
                            type: string
                            example: 8EMH5IIB
                    custom_attributes:
                      type: object
                      properties: {}
                    schedules:
                      type: array
                      items:
                        type: object
                        properties: {}
                  title: Group
                - type: object
                  properties:
                    collection_uuid:
                      type: string
                    name:
                      type: string
                  required:
                  - collection_uuid
                  title: Scene
              examples:
                Created - Group:
                  summary: Created - Group
                  value:
                    collection_uuid: f64ce632-xxxxx-b772-fdfd6de88f54
                    name: API Testing
                    type: GROUP
                    devices:
                    - dsn: AC000W000458392
                      product_name: Ayla Devkit
