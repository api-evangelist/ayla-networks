openapi: 3.2.0
info:
  title: user-service Token Sign In.json API
  version: '1.0'
servers:
- url: https://user-dev.aylanetworks.com/
security:
- sec0: []
tags:
- name: Token Sign In.json
paths:
  /api/v1/token_sign_in.json:
    post:
      summary: SSO sign in
      description: 'This API is called by the app to log into the Ayla service with the Identity Provider-issued access token.

        Specify the token issued by the identity provider in the ```token``` field.

        Upon successful SSO sign in, continue to validate token.'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - app_id
              - app_secret
              - token
              properties:
                app_id:
                  type: string
                  description: Unique application identifier of the app to which identity provider belongs.
                app_secret:
                  type: string
                  description: Application secret of the app to which identity provider belongs.
                token:
                  type: string
                  description: Unique token of identity provider’s user.
      responses:
        '200':
          description: Ok
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"access_token\":\"aea5f45e3bfb45fa8715b6bc2e1039dc\",\n  \"refresh_token\":\"192fd8792ae14fcfa1dec3940b57dd00\",\n  \"expires_in\":86400,\n  \"role\":\"EndUser\"\n}\n"
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: aea5f45e3bfb45fa8715b6bc2e1039dc
                  refresh_token:
                    type: string
                    example: 192fd8792ae14fcfa1dec3940b57dd00
                  expires_in:
                    type: integer
                    example: 86400
                    default: 0
                  role:
                    type: string
                    example: EndUser
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Token Sign In.json
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-default: auth_token
