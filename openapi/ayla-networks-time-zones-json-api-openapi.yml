tags:
- name: Time Zones.json
paths:
  /time_zones.json:
    get:
      summary: Get timezone
      description: 'This API returns information about the specified time zone.


        For the tz_id query parameter, use values from the TZ database name column in this table.'
      operationId: get-timezone-1
      parameters:
      - name: tz_id
        in: query
        description: Timezone ID.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    Base UTC Offset: -08:00
                    DST: true
                    DST Active: true
                    DST Next Change Date: '2026-11-01'
                    DST Next Change Time: 02:00
              schema:
                type: object
                properties:
                  Base UTC Offset:
                    type: string
                    example: -08:00
                  DST:
                    type: boolean
                    example: true
                    default: true
                  DST Active:
                    type: boolean
                    example: true
                    default: true
                  DST Next Change Date:
                    type: string
                    example: '2026-11-01'
                  DST Next Change Time:
                    type: string
                    example: 02:00
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Time Zones.json
