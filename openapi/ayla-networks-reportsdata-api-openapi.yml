  version: '1.0'
  description: 'Operations tagged Reportsdata across 3 of this provider''s published API definitions: ayla-networks-contracts-service-openapi.yml, ayla-networks-metering-service-openapi.yml, ayla-networks-reports-service-openapi.yml. Each path carries the servers of the definition it was published in.'
