  /oems/{oem_id}/end_users.json:
    get:
      summary: Get end users
      description: 'This API returns all the end users of an OEM. It excludes users with other roles.

        Response data may appear in one of two formats depending on whether you set the paginated query parameter to true or 1. If so, the API returns data using Format A:


        **Format A**


        {

        "previous_page": null,

        "next_page": 2,

        "current_page_number": 1,

        "start_count_on_page": 1,

        "end_count_on_page": 100,

        "total": 0,

        "users": []

        }


        Otherwise, the API returns data using Format B (without page details):


        **Format B**


        [


        ]'
