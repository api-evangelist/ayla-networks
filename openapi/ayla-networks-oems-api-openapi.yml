openapi: 3.2.0
info:
  title: Ayla Networks Oems API
  version: '1.0'
  description: 'Operations tagged Oems across 3 of this provider''s published API definitions: ayla-networks-dealer-service-openapi.yml, ayla-networks-iot-command-center-openapi.yml, ayla-networks-user-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://user-dev.aylanetworks.com/
- url: https://icc-dev.aylanetworks.com/icc/v1/
security:
- sec0: []
tags:
- name: Oems
paths:
  /api/v1/oems/{oem_id}/dealers.json:
    get:
      summary: Get dealers
      description: 'This API fetches the list of dealers associated with the specified OEM.

        Access Control:


        Ayla::Admin - read | write


        Ayla::Staff - read


        OEM::Admin - read | write


        OEM::Staff - read'
      operationId: get-dealers
      parameters:
      - name: oem_id
        in: path
        description: OEM ID to find the OEM and fetch the list of dealers.
        schema:
          type: string
        required: true
      - name: paginated
        in: query
        description: true = Response is shown in paginated format. <br> false = Response is shown without pagination.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                With Pagination:
                  value:
                    previous_page: null
                    next_page: null
                    current_page_number: 1
                    start_count_on_page: 1
                    end_count_on_page: 3
                    total: 3
                    dealers:
                    - name: Test Dealer
                      oem_id: xxxxx8
                      state: Karnataka
                      uuid: xxxxxxxxxxx
                    - name: Test Dealer2
                      oem_id: xxxxx8
                      state: Karnataka
                      uuid: 43xxxxxx-dxx1-11xx-xxe0-2xxxxxxxxx5
                    - name: Dealer53
                      oem_id: xxxxx8
                      state: Karnataka
                      uuid: 3cxxxxxxxxxxe-xxef-9xx1-xxxxxxxx81f
                Without Pagination:
                  value: "[\n    {\n      \"name\": \"Test Dealer\",\n      \"oem_id\": xxxxx8,\n      \"state\": \"Karnataka\",\n      \"uuid\": “2exxxxx-xxe1-xxeb-xxxx-0xxxxxxxxa86\"\n    },\n    {\n      \"name\": \"Test Dealer2\",\n      \"oem_id\": 6xxxxx,\n      \"state\": \"Karnataka\",\n      \"uuid\": \"43xxxxxx-dxx1-11xx-xxe0-2xxxxxxxxx5\"\n    },\n    {\n      \"name\": \"Dealer53\",\n      \"oem_id\": 6xxxxx,\n      \"state\": \"Karnataka\",\n      \"uuid\": \"3cxxxxxxxxxxe-xxef-9xx1-xxxxxxxx81f\"\n    }\n]"
              schema:
                type: object
                properties:
                  previous_page:
                    type: integer
                  next_page:
                    type: integer
                  current_page_number:
                    type: integer
                    example: 1
                    default: 0
                  start_count_on_page:
                    type: integer
                    example: 1
                    default: 0
                  end_count_on_page:
                    type: integer
                    example: 3
                    default: 0
                  total:
                    type: integer
                    example: 3
                    default: 0
                  dealers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: Test Dealer
                        oem_id:
                          type: string
                          example: xxxxx8
                        state:
                          type: string
                          example: Karnataka
                        uuid:
                          type: string
                          example: xxxxxxxxxxx
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Oems
    post:
      summary: Create dealer
      description: 'This API creates a dealer.

        Access permission: Ayla::Admin and OEM::Admin.

        For more information on dealer, please refer Dealer user.'
      operationId: create-dealer
      parameters:
      - name: oem_id
        in: path
        description: OEM ID. Used to identify the OEM to which the new dealer is created.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dealer:
                  properties:
                    name:
                      type: string
                      description: Name of the dealer.
                    email:
                      type: string
                      description: Email address of the dealer.
                    street:
                      type: string
                      description: Street name of the dealer.
                    city:
                      type: string
                      description: City of the dealer.
                    state:
                      type: string
                      description: State name.
                    zip:
                      type: string
                      description: Address zip code.
                    country:
                      type: string
                      description: Dealer's country name.
                    phone_country_code:
                      type: string
                      description: Country code for the dealer's phone number.
                    phone:
                      type: string
                      description: Dealer's phone number.
                  required:
                  - name
                  - email
                  - street
                  - phone_country_code
                  - phone
                  type: object
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value:
                    city: Bengaluru
                    country: India
                    email: dealer53@aylanetworks.com
                    name: Dealer53
                    oem_id: 6xxxx
                    phone: 90xxxxxxx9
                    phone_country_code: '+91'
                    street: Kadubeesanahalli
                    state: Karnataka
                    uuid: 3cxxxxxx-0dee-xxxx-xxxx-fxxxxxxxe681f
                    zip: '560103'
              schema:
                type: object
                properties:
                  city:
                    type: string
                    example: Bengaluru
                  country:
                    type: string
                    example: India
                  email:
                    type: string
                    example: dealer53@aylanetworks.com
                  name:
                    type: string
                    example: Dealer53
                  oem_id:
                    type: string
                    example: 6xxxx
                  phone:
                    type: string
                    example: 90xxxxxxx9
                  phone_country_code:
                    type: string
                    example: '+91'
                  street:
                    type: string
                    example: Kadubeesanahalli
                  state:
                    type: string
                    example: Karnataka
                  uuid:
                    type: string
                    example: 3cxxxxxx-0dee-xxxx-xxxx-fxxxxxxxe681f
                  zip:
                    type: string
                    example: '560103'
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Oems
    servers:
    - url: https://user-dev.aylanetworks.com/
  /api/v1/oems/{oem_id}/dealers/dealer_roles.json:
    get:
      summary: Get dealer roles
      description: 'This API fetches the role(s) of the dealer(s) for the specified OEM.

        Access Control:


        Ayla::Admin - read


        Ayla::Staff - read


        OEM::Admin - read


        OEM::Staff - read'
      operationId: get-dealer-roles
      parameters:
      - name: oem_id
        in: path
        description: OEM ID.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"role_name\": \"Dealer::Admin\"\n  },\n  {\n    \"role_name\": \"Dealer::Manager\"\n  },\n  {\n    \"role_name\": \"Dealer::Staff\"\n  },\n  {\n    \"role_name\": \"Dealer::Supervisor\"\n  }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    role_name:
                      type: string
                      example: Dealer::Admin
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Oems
    servers:
    - url: https://user-dev.aylanetworks.com/
  /api/v1/oems/{oem_id}/dealers/{dealer_uuid}.json:
    put:
      summary: Update dealer
      description: 'This API updates details of a dealer.

        Access Control:


        Ayla::Admin


        OEM::Admin'
      operationId: update-dealer
      parameters:
      - name: oem_id
        in: path
        description: OEM ID.
        schema:
          type: string
        required: true
      - name: dealer_uuid
        in: path
        description: UUID of the dealer you want to update.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dealer:
                  properties:
                    name:
                      type: string
                      description: Name of the dealer.
                    email:
                      type: string
                      description: Email address of the dealer.
                    state:
                      type: string
                      description: Dealer's state.
                    street:
                      type: string
                      description: Street address of the dealer.
                    city:
                      type: string
                      description: City of the dealer.
                    zip:
                      type: string
                      description: Address zipcode.
                    country:
                      type: string
                      description: Dealer's country.
                    phone:
                      type: string
                      description: Phone number of the dealer.
                    phone_country_code:
                      type: string
                      description: Country code of the dealer's phone.
                  required: []
                  type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    city: Bengaluru
                    country: India
                    email: dealer53@aylanetworks.com
                    name: Dealer53
                    oem_id: xxxxx8
                    phone: 90xxxxxxxxx
                    phone_country_code: '+91'
                    street: Kadubeesanahalli
                    state: Karnataka
                    uuid: xxxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxx
                    zip: '560103'
              schema:
                type: object
                properties:
                  city:
                    type: string
                    example: Bengaluru
                  country:
                    type: string
                    example: India
                  email:
                    type: string
                    example: dealer53@aylanetworks.com
                  name:
                    type: string
                    example: Dealer53
                  oem_id:
                    type: string
                    example: xxxxx8
                  phone:
                    type: string
                    example: 90xxxxxxxxx
                  phone_country_code:
                    type: string
                    example: '+91'
                  street:
                    type: string
                    example: Kadubeesanahalli
                  state:
                    type: string
                    example: Karnataka
                  uuid:
                    type: string
                    example: xxxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxx
                  zip:
                    type: string
                    example: '560103'
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Oems
    get:
      summary: Get dealer by uuid
      description: 'This API fetches the details of a dealer specified by uuid.

        Access Control:


        Ayla::Admin


        OEM::Admin - read | write'
      operationId: get-dealer-by-uuid
      parameters:
      - name: oem_id
        in: path
        description: OEM ID.
        schema:
          type: string
        required: true
      - name: dealer_uuid
        in: path
        description: UUID of the dealer you want to fetch.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    city: Bengaluru
                    country: India
                    email: dealer53@aylanetworks.com
                    name: Dealer53
                    oem_id: xxxx8
                    phone: 900xxxxxx9
                    phone_country_code: '+91'
                    street: Kadubeesanahalli
                    state: Karnataka
                    uuid: 3xxxxxx-0xxx-xxxx-xxxx-f2xxxxxxx681f
                    zip: '560103'
              schema:
                type: object
                properties:
                  city:
                    type: string
                    example: Bengaluru
                  country:
                    type: string
                    example: India
                  email:
                    type: string
                    example: dealer53@aylanetworks.com
                  name:
                    type: string
                    example: Dealer53
                  oem_id:
                    type: string
                    example: xxxx8
                  phone:
                    type: string
                    example: 900xxxxxx9
                  phone_country_code:
                    type: string
                    example: '+91'
                  street:
                    type: string
                    example: Kadubeesanahalli
                  state:
                    type: string
                    example: Karnataka
                  uuid:
                    type: string
                    example: 3xxxxxx-0xxx-xxxx-xxxx-f2xxxxxxx681f
                  zip:
                    type: string
                    example: '560103'
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Oems
    delete:
      summary: Delete dealer
      description: 'This API deletes the specified dealer.

        Access Control:


        Ayla::Admin


        OEM::Admin'
      operationId: delete-dealer
      parameters:
      - name: oem_id
        in: path
        description: OEM ID.
        schema:
          type: string
        required: true
      - name: dealer_uuid
        in: path
        description: UUID of the dealer you want to delete.
        schema:
          type: string
        required: true
      responses:
        '204':
          description: No Content
          content:
            application/json:
              examples:
                No Content:
                  summary: No Content
                  value: '{}'
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Oems
    servers:
    - url: https://user-dev.aylanetworks.com/
  /api/v1/oems/{oem_id}/dealers/{dealer_uuid}/end_users.json:
    get:
      summary: Get end users of a dealer
      description: 'This API fetches all the end users associated with the specified dealer.

        Access Control:


        Ayla::Admin - read | write


        Ayla::Staff - read


        OEM::Admin - read | write


        OEM::Staff - read


        Dealer::Admin - read


        Dealer::Manager - read


        Dealer:: Supervisor - read'
      operationId: get-end-users-of-a-dealer
      parameters:
      - name: oem_id
        in: path
        description: OEM ID.
        schema:
          type: string
        required: true
      - name: dealer_uuid
        in: path
        description: UUID of the dealer.
        schema:
          type: string
        required: true
      - name: paginated
        in: query
        description: true = Response is shown in paginated format. <br> false = Response is shown without pagination.
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                facility_uuid:
                  type: string
                  description: uuid to identify the facility.
                first_name:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                With Pagination:
                  value:
                    previous_page: null
                    next_page: null
                    current_page_number: 1
                    start_count_on_page: 1
                    end_count_on_page: 1
                    total: 1
                    users:
                    - approved: true
                      confirmed: true
                      id: 4xxxxx2
                      uuid: 4xxxxxxx2-xxxx-xxxx-xxxx-564xxxxxxx4d
                      origin_oem_name: Ayla Automation
                      roles:
                      - id: 2342
                        name: EndUser
                Without Pagination:
                  summary: Without Pagination
                  value:
                  - approved: true
                    confirmed: true
                    id: 3
                    uuid: f906d368-828c-11e5-9609-0ee0c870bcec
                    origin_oem_name: Ayla
                    roles:
                    - id: 13
                      name: EndUser
                    dealers:
                    - dealer_name: stalin
                      dealer_uuid: 94c71484-4ded-11f1-93dd-6e791713c565
                      facilities: []
              schema:
                type: object
                properties:
                  previous_page:
                    type: integer
                  next_page:
                    type: integer
                  current_page_number:
                    type: integer
                    example: 1
                    default: 0
                  start_count_on_page:
                    type: integer
                    example: 1
                    default: 0
                  end_count_on_page:
                    type: integer
                    example: 1
                    default: 0
                  total:
                    type: integer
                    example: 1
                    default: 0
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        approved:
                          type: boolean
                          example: true
                          default: true
                        confirmed:
                          type: boolean
                          example: true
                          default: true
                        id:
                          type: string
                          example: 4xxxxx2
                        uuid:
                          type: string
                          example: 4xxxxxxx2-xxxx-xxxx-xxxx-564xxxxxxx4d
                        origin_oem_name:
                          type: string
                          example: Ayla Automation
                        roles:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 2342
                                default: 0
                              name:
                                type: string
                                example: EndUser
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Oems
    servers:
    - url: https://user-dev.aylanetworks.com/
  /api/v1/oems/{oem_id}/dealers/{dealer_uuid}/users.json:
    post:
      summary: Create dealer user
      description: 'This API creates a dealer user for the specified dealer.

        Access Control:


        Ayla::Admin - read | write


        Ayla::Staff - read | write


        OEM::Admin - read | write


        OEM::Staff - read | write


        Dealer::Admin - read | write


        Dealer::Manager - read | write'
      operationId: create-dealer-user
      parameters:
      - name: oem_id
        in: path
        description: OEM ID.
        schema:
          type: string
        required: true
      - name: dealer_uuid
        in: path
        description: UUID of the dealer.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  properties:
                    email:
                      type: string
                      description: Email address of the dealer user.
                    password:
                      type: string
                      description: Provide password to the dealer user to access/perform required tasks.
                    password_confirmation:
                      type: string
                      description: Re-enter the password for confirmation.
                    firstname:
                      type: string
                      description: First name of the dealer user.
                    lastname:
                      type: string
                      description: Last name of the dealer user.
                    role:
                      type: string
                    company:
                      type: string
                      description: Company name of the dealer user.
                    phone:
                      type: string
                      description: Phone number of the dealer user.
                    phone_country_code:
                      type: string
                      description: Country code of the dealer user's phone.
                    street:
                      type: string
                      description: Street address of the dealer user.
                    city:
                      type: string
                      description: City of the dealer user.
                    state:
                      type: string
                      description: Dealer user's state.
                    country:
                      type: string
                      description: Dealer user's country.
                    zip:
                      type: string
                      description: Address zipcode.
                  required:
                  - email
                  - password
                  - password_confirmation
                  - firstname
                  - lastname
                  - role
                  - phone
                  - phone_country_code
                  type: object
      responses:
        '201':
          description: Created
          content:
            application/json:
