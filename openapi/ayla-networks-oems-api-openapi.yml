                    terms_accepted_at: '2026-05-14T09:01:14Z'
                    terms_email_sent_at: null
                    terms_token: null
                    updated_at: '2026-05-14T09:01:14Z'
                    username: stalin1@gmail.com
                    zip: null
                    uuid: 75d5091e-4f73-11f1-ac0a-f6068ea05808
                    roles:
                    - id: 13
