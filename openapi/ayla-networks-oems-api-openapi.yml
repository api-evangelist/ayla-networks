          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Oems
    get:
      summary: Search dealer users
      description: 'This API fetches all the dealer users associated with the specified dealer. The result is based on your search criteria.

        Access Control:


        Ayla::Admin - read | write


        Ayla::Staff - read


        OEM::Admin - read | write


        OEM::Staff - read


        NOTE: The example response provided for this API assumes that General Data Protection Regulation (GDPR) is enabled. If GDPR is not enabled, the response will include additional dealer user data.'
      operationId: search-dealer-users
      parameters:
      - name: oem_id
        in: path
        description: OEM ID.
        schema:
          type: string
        required: true
      - name: dealer_uuid
        in: path
        description: UUID of the dealer.
        schema:
          type: string
        required: true
      - name: firstname
        in: query
        description: First name of the dealer user.
        schema:
          type: string
      - name: lastname
        in: query
        description: Last name of the dealer user.
        schema:
          type: string
      - name: uuid
        in: query
        description: UUID of the dealer user you want to search.
        schema:
          type: string
      - name: email
        in: query
        description: Email address of the dealer user.
        schema:
          type: string
      - name: role
        in: query
        description: Dealer user role.
        schema:
          type: string
