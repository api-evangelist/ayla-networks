paths:
  /mqtteventprocessor/api/v1/credentials.json:
    get:
      summary: GET MQTT credentials
      description: Returns MQTT credentials for the caller to connect with EMQX broker.
      operationId: get-mqtt-credentials
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"credentials\": {\n    \"username\": \"aylaCloud\",\n    \"password\": \"axxxxxxc-fc2f-4c91-b620-xxxxxxxx64c\",\n    \"client_id\": \"cmqtt-53xxxxx7-d79d-45df-a8c3-xxxxxxxxxd340\",\n    \"is_filter_available\": true\n  }\n}"
              schema:
                type: object
                properties:
                  credentials:
                    type: object
                    properties:
                      username:
                        type: string
                        example: aylaCloud
                      password:
                        type: string
                        example: axxxxxxc-fc2f-4c91-b620-xxxxxxxx64c
                      client_id:
                        type: string
                        example: cmqtt-53xxxxx7-d79d-45df-a8c3-xxxxxxxxxd340
                      is_filter_available:
                        type: boolean
                        example: true
                        default: true
        '400':
          content: {}
          description: Bad Request
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
      deprecated: false
      tags:
      - Mqtteventprocessor
