                value:
                  filter:
                    name: Mobile Subscription 01
                    description: Mobile Subscription-01
                    oem_id: 14xxxxxx1
                    client_type: mobile
                    user_uuid: 51dda1xxxxxxxv45
                    filter_conditions:
