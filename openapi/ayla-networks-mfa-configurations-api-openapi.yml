                  value: ''
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Mfa Configurations
