paths:
  /mfa_configurations/apps_list.json:
    get:
      summary: Get clients (Deprecated)
      description: This API is used to fetch the list of clients of the specified OEM.
      operationId: get-clients
      parameters:
      - name: oem_id
        in: query
        description: An array of OEM IDs. This is only for Ayla::Admin.
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firebase_config:
                  type: boolean
                  description: If true, the API will return the clients which are Firebase configured.
            examples:
              Example response:
                value:
                - name: SmartTouch
                  app_id: ST12_BA
                - name: WebCon
                  app_id: Webcon_Test
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '401':
          description: '401'
          content:
