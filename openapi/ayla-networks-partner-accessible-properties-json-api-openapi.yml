- name: Partner Accessible Properties.json
paths:
  /api/v1/partner_accessible_properties.json:
    get:
      summary: Get properties
      description: This API returns an array of accessible properties for the given OEM model and role.
      operationId: get-properties-by-oem-model-and-role
      parameters:
      - name: oem_id
        in: query
        schema:
          type: string
      - name: oem_model
        in: query
        schema:
          type: string
      - name: role
        in: query
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"oem_id\": \"0dfc7900\",\n    \"oem_model\": \"ledevb-test\",\n    \"role\": \"Partner::OEM::Staff\",\n    \"property_name\": \"integer_input_tp\",\n    \"operation\": \"read\",\n    \"uuid\": \"28363e54-bd11-11eb-9067-xxxxxxxxxxxxx\",\n    \"created_at\": \"2021-05-25T04:27:17Z\",\n    \"updated_at\": \"2021-05-25T04:27:17Z\"\n  },\n  {\n    \"oem_id\": \"0dfc7900\",\n    \"oem_model\": \"ledevb-test\",\n    \"role\": \"Partner::OEM::Staff\",\n    \"property_name\": \"integer_output_tp\",\n    \"operation\": \"read\",\n    \"uuid\": \"47253e54-bd11-11eb-9067-xxxxxxxxxxxxx\",\n    \"created_at\": \"2021-05-25T04:27:17Z\",\n    \"updated_at\": \"2021-05-25T04:27:17Z\"\n  }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    oem_id:
                      type: string
                      example: 0dfc7900
                    oem_model:
                      type: string
                      example: ledevb-test
                    role:
                      type: string
                      example: Partner::OEM::Staff
                    property_name:
                      type: string
                      example: integer_input_tp
                    operation:
                      type: string
                      example: read
                    uuid:
                      type: string
                      example: 28363e54-bd11-11eb-9067-xxxxxxxxxxxxx
                    created_at:
                      type: string
                      example: '2021-05-25T04:27:17Z'
                    updated_at:
                      type: string
                      example: '2021-05-25T04:27:17Z'
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Partner Accessible Properties.json
    post:
      summary: Configure properties
      description: This API is used to configure a specific property based on the partner role.
      operationId: configure-properties-based-on-role
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                partner_accessible_property:
                  properties:
                    oem_id:
                      type: string
                    oem_model:
                      type: string
                    role:
                      type: string
                    property_name:
                      type: string
                    operation:
                      type: string
                      description: Read or Write.  Non-case sensitive.
                  required:
                  - oem_model
                  - role
                  - property_name
                  - operation
                  type: object
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  oem: \"Ayla\",\n  oem_model: \"ledevb-test\",\n  role: \"Partner::OEM::Staff\",\n  property_name: \"integer_output_tp\",\n  operation: \"write\",\n  uuid: \"3018385e-xxxx-11ea-xxxx-0a580xxxxxxx\"\n}"
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Partner Accessible Properties.json
