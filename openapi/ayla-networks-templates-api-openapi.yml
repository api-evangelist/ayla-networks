openapi: 3.2.0
info:
  title: device-service Templates API
  version: '1.0'
servers:
- url: https://ads-dev.aylanetworks.com/apiv1/
security:
- sec0: []
tags:
- name: Templates
paths:
  /templates/{id}.json:
    put:
      summary: Update template
      description: This API is used to update a specific template.
      operationId: create-template-2
      parameters:
      - name: id
        in: path
        description: Template ID.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - visibility
              - registration_type
              - template_type
              - name
              - description
              properties:
                visibility:
                  type: string
                  description: 'Visibility of the template. The possible values are: public, private, or oem.'
                registration_type:
                  type: string
                  description: 'Registration method for the device. The possible values are: Same-LAN, Button-Push, AP-Mode, Display, Dsn, or None.'
                template_type:
                  type: string
                  description: 'Type of template. The possible values are: Wifi, Node, Gateway, Cluster, or Sensor.'
                gateway_type:
                  type: string
                  description: 'Mandatory if "template_type" is "Gateway". The possible values are: Zigbee or Generic.'
                name:
                  type: string
                  description: Name of the template.
                description:
                  type: string
                  description: Brief info about the template.
                model:
                  type: string
                  description: OEM Model to which this template applies or Cluster ID in case of Cluster template.
                connection_priority:
                  type: array
                  description: 'Priority order of local connection type(s). The possible values are: [], [“LAN“], [“BLE“],  [“LAN”, ”BLE“], or [“BLE”, “LAN“]. Where, [] is the default value.'
                  items:
                    type: string
                lanip_keep_alive:
                  type: integer
                  description: Mandatory if "connection_priority" is not empty and should be greater than 29.
                  format: int32
                lanip_lifetime:
                  type: integer
                  description: Mandatory if "connection_priority" is not empty and should be greater than 0.
                  format: int32
                sync_freq:
                  type: integer
                  description: Use this parameter to set the time duration (in seconds) for which the sensor device should be marked as SelfOffline. Please note, this parameter is applicable only for sensor-type templates.
                  format: int32
      responses:
        '200':
          description: OK
          content: {}
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Templates
    get:
      summary: Get template
      description: This API is used to fetch a specific template.
      operationId: get-template
      parameters:
      - name: id
        in: path
        description: Template ID.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    template:
                      id: 632259
                      visibility: public
                      name: api_test_native_mqtt
                      description: api test mqtt
                      tags: null
                      model: null
                      product_class: null
                      user_id: 5485317
                      oem: null
                      url: null
                      username: null
                      password: null
                      on_connect: null
                      ip_change: null
                      registration_type: Same-LAN
                      lanip_enabled: false
                      lanip_keep_alive: null
                      lanip_lifetime: null
                      lanip_auto_sync: null
                      version: '*'
                      product_name: null
                      template_type: Wifi
                      gateway_type: null
                      cluster_id: null
                      created_at: '2026-08-20T06:33:51Z'
                      updated_at: '2026-08-20T06:33:51Z'
                      homekit: null
                      template_key: null
                      sunrise_sunset_supported: false
                      connection_priority: []
                      sync_freq: null
                      classification: 2
              schema:
                type: object
                properties:
                  template:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 632259
                        default: 0
                      visibility:
                        type: string
                        example: public
                      name:
                        type: string
                        example: api_test_native_mqtt
                      description:
                        type: string
                        example: api test mqtt
                      tags:
                        type: string
                      model:
                        type: string
                      product_class:
                        type: string
                      user_id:
                        type: integer
                        example: 5485317
                        default: 0
                      oem:
                        type: string
                      url:
                        type: string
                      username:
                        type: string
                      password:
                        type: string
                      on_connect:
                        type: string
                      ip_change:
                        type: string
                      registration_type:
                        type: string
                        example: Same-LAN
                      lanip_enabled:
                        type: boolean
                        example: false
                        default: true
                      lanip_keep_alive:
                        type: string
                      lanip_lifetime:
                        type: string
                      lanip_auto_sync:
                        type: string
                      version:
                        type: string
                        example: '*'
                      product_name:
                        type: string
                      template_type:
                        type: string
                        example: Wifi
                      gateway_type:
                        type: string
                      cluster_id:
                        type: string
                      created_at:
                        type: string
                        example: '2026-08-20T06:33:51Z'
                      updated_at:
                        type: string
                        example: '2026-08-20T06:33:51Z'
                      homekit:
                        type: string
                      template_key:
                        type: string
                      sunrise_sunset_supported:
                        type: boolean
                        example: false
                        default: true
                      connection_priority:
                        type: array
                        items:
                          type: object
                          properties: {}
                      sync_freq:
                        type: string
                      classification:
                        type: integer
                        example: 2
                        default: 0
        '401':
          content: {}
          description: Unauthorized
      tags:
      - Templates
  /templates/{id}/template_properties.json:
    post:
      summary: Create template properties
      description: 'This API is used to create template properties.

        *Access Control*: OEM::Admin and above


        For **feed_type** == **air_quality**, the value of the parameter "feed_data" can be any of the following:

        * air_quality_category

        * air_quality_index

        * co

        * general_group

        * no2

        * o3

        * pm10

        * pm2.5

        * primary_pollutant

        * sensitive_group

        * so2


        For **feed_type** == **weather_condition**, the value of the parameter "feed_data" can be any of the following:

        * relative_humidity

        * sunrise

        * sunset

        * temp_c

        * temp_f

        * weather_condition'
      operationId: create-template-properties
      parameters:
      - name: id
        in: path
        description: Template ID.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template_property:
                  properties:
                    base_type:
                      type: string
                      description: Data type of property (data type).
                    name:
                      type: string
                      description: Property name
                    scope:
                      type: string
                      description: Visibility of the property. Please select "oem" if the property is not visible to the end user.
                    direction:
                      type: string
                      description: Property value flow direction.
                    type:
                      type: string
                      description: 'Type of property. Possible values: "TemplateProperty" or "TemplateFeedProperty"'
                    feed_params:
                      type: string
                      description: This parameter is mandatory, if type = TemplateFeedProperty.
                    feed_interval:
                      type: string
                      description: This parameter is mandatory, if type = TemplateFeedProperty.
                    feed_type:
                      type: string
                      description: Type of feed. Possible values are "air_quality" or "weather_condition". This parameter is mandatory, if type = TemplateFeedProperty.
                    feed_data:
                      type: string
                      description: This parameter is mandatory, if type = TemplateFeedProperty. Check API description section for possible values for this parameter.
                    host_sw_version:
                      type: string
                      description: Host software version number.
                    mime_type:
                      type: string
                      description: Mime type.
                    track_only_changes:
                      type: boolean
                    time_series:
                      type: boolean
                    ack_enabled:
                      type: string
                    passthrough:
                      type: boolean
                      default: 'false'
                      description: Specifies whether pass-through is enabled for the device. The default value is false. For devices using native MQTT, the value is true.
                  required:
                  - base_type
                  - name
                  - scope
                  - direction
                  - type
                  type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    template_property:
                      id: 6811578
                      template_id: 100
              schema:
                type: object
                properties:
                  template_property:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 6811578
                        default: 0
                      template_id:
                        type: integer
                        example: 100
                        default: 0
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      tags:
      - Templates
