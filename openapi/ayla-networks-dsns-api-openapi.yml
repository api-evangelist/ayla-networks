  /dsns/{dsn}/data.json:
    post:
      summary: Create device metadatum
      description: This API creates a single datum object for the specified device.
      operationId: create-device-metadata
      parameters:
      - name: dsn
        in: path
        description: Unique device serial number.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                datum:
                  properties:
                    key:
                      type: string
                      description: Name of the datum/metadata.
                    value:
                      type: string
                      description: Value of the datum.
                  required:
                  - key
                  - value
                  type: object
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value:
                    datum:
                      key: '1'
                      value: '1'
                      created_at: '2026-04-13T05:51:43Z'
                      updated_at: '2026-04-13T05:51:43Z'
                      from_template: false
                      created: null
                      dsn: AC000W029118485
              schema:
                type: object
                properties:
                  datum:
                    type: object
                    properties:
                      key:
                        type: string
                        example: '1'
                      value:
                        type: string
                        example: '1'
                      created_at:
                        type: string
                        example: '2026-04-13T05:51:43Z'
                      updated_at:
                        type: string
                        example: '2026-04-13T05:51:43Z'
                      from_template:
                        type: boolean
                        example: false
                        default: true
                      created:
                        type: string
                      dsn:
                        type: string
                        example: AC000W029118485
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Dsns
    get:
      summary: Get device metadata
      description: 'This API returns metadata associated with the specified device.


        The API returns an array of datum objects. Each datum includes a key and a corresponding value.'
      operationId: get-device-metadata
      parameters:
      - name: dsn
        in: path
        description: Unique device serial number.
        schema:
          type: string
        required: true
      - name: keys
        in: query
        description: Filter on the key. Exact match or s%=beginning with s; %s%=contains s; %s=ends with s.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                  - datum:
                      created: null
                      created_at: '2021-04-06T13:39:43Z'
                      from_template: false
                      key: Location
                      updated_at: '2021-04-06T13:39:43Z'
                      value: TR
                      dsn: TESTDSN_500023_045
              schema:
                type: array
                items:
                  type: object
                  properties:
                    datum:
                      type: object
                      properties:
                        created:
                          type: string
                        created_at:
                          type: string
                          example: '2021-04-06T13:39:43Z'
                        from_template:
                          type: boolean
                          example: false
                          default: true
                        key:
                          type: string
                          example: Location
                        updated_at:
                          type: string
                          example: '2021-04-06T13:39:43Z'
                        value:
                          type: string
                          example: TR
                        dsn:
                          type: string
                          example: TESTDSN_500023_045
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Dsns
    servers:
    - url: https://ads-dev.aylanetworks.com/apiv1/
  /dsns/{dsn}/data/{datumKey}.json:
