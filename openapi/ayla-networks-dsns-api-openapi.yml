    get:
      summary: Get datapoints by DSN
      description: 'This API returns an array of datapoint objects in one of two formats depending on the ```paginated``` query parameter. If ```paginated=true```, this API returns data in Format A, and heeds the ```per_page``` query parameter.


        **Format A**


        {

