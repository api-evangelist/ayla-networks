      - Dsns
    put:
      summary: Rename device by DSN
      description: This API renames a device.
      operationId: get-device-by-dsn-1
      parameters:
      - name: dsn
        in: path
        description: Device serial number.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device:
                  properties:
                    product_name:
                      type: string
                      description: Product name.
                  required:
                  - product_name
                  type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                OK:
                  summary: OK
                  value: OK
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      tags:
      - Dsns
    servers:
    - url: https://ads-dev.aylanetworks.com/apiv1/
