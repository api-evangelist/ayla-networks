      operationId: get-device-metadata-by-key
      parameters:
      - name: dsn
        in: path
        description: Unique device serial number.
        schema:
          type: string
        required: true
      - name: datumKey
        in: path
        description: Key in key/value pair.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    datum:
                      created: null
                      created_at: '2021-04-06T13:39:43Z'
                      from_template: false
                      key: Location
                      updated_at: '2021-04-06T13:39:43Z'
                      value: TR
                      dsn: TESTDSN_500023_045
              schema:
                type: object
                properties:
                  datum:
                    type: object
                    properties:
                      created:
                        type: string
                      created_at:
                        type: string
                        example: '2021-04-06T13:39:43Z'
                      from_template:
                        type: boolean
                        example: false
                        default: true
                      key:
                        type: string
                        example: Location
                      updated_at:
                        type: string
                        example: '2021-04-06T13:39:43Z'
                      value:
                        type: string
                        example: TR
                      dsn:
                        type: string
                        example: TESTDSN_500023_045
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Dsns
    put:
      summary: Update device metadata
      description: This API updates a single datum object for the specified device.
      operationId: update-device-metadata
      parameters:
      - name: dsn
        in: path
        description: Unique device serial number.
        schema:
          type: string
        required: true
