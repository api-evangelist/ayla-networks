openapi: 3.2.0
info:
  title: Ayla Networks Dsns API
  version: '1.0'
  description: 'Operations tagged Dsns across 2 of this provider''s published API definitions: ayla-networks-device-service-openapi.yml, ayla-networks-iot-command-center-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://ads-dev.aylanetworks.com/apiv1/
- url: https://icc-dev.aylanetworks.com/icc/v1/
security:
- sec0: []
tags:
- name: Dsns
paths:
  /dsns/{dsn}.json:
    get:
      summary: Get device by DSN
      description: This API returns information about the device specified by DSN.
      operationId: get-device-by-dsn
      parameters:
      - name: dsn
        in: path
        description: Unique device serial number.
        schema:
          type: string
        required: true
      - name: show_optimal
        in: query
        description: If "true", then "connection_priority" key will not be present in the response body.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    device:
                      id: 6440993
                      product_name: P09A cameras
                      model: AY001MRT1
                      dsn: AC000W029118485
                      oem: 0xxxx00
                      oem_model: null
                      connect_path: null
