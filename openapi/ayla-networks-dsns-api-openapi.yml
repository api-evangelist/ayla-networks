      description: 'This API creates a datapoint for the specified property.

        **Note**:The metadata in the request data is optional and you can enter maximum of 5 metadata entries.'
      operationId: create-datapoint-by-dsn
      parameters:
      - name: dsn
        in: path
        description: Unique device serial number.
        schema:
          type: string
        required: true
      - name: propName
        in: path
        description: Device property name.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                datapoint:
                  type: object
                  description: Datapoint payload for the item.
                  properties:
                    value:
                      type: string
                      description: Datapoint value. The accepted format depends on the property's base type.
                    metadata:
                      type: object
                      description: The metadata associated with the datapoint.
                      properties:
                        key1:
                          type: string
                          description: The key-value pairs containing additional information associated with the datapoint.
                        key2:
                          type: string
                          description: The key-value pairs containing additional information associated with the datapoint.
                        key3:
                          type: string
                          description: The key-value pairs containing additional information associated with the datapoint.
                        key4:
                          type: string
                          description: The key-value pairs containing additional information associated with the datapoint.
                        key5:
                          type: string
                          description: The key-value pairs containing additional information associated with the datapoint.
                  required:
                  - value
              required:
              - datapoint
            examples:
              Example:
                summary: Example
                value:
                  datapoint:
                    value: '0'
                    metadata:
                      key1: '1'
                      key2: '123'
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value:
                    datapoint:
                      updated_at: '2026-04-15T07:16:54Z'
                      created_at: '2026-04-15T07:16:54Z'
                      echo: false
                      metadata:
                        key1: '1'
                        key2: '123'
