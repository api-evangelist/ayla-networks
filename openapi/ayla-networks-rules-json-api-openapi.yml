paths:
  /rules.json:
    post:
      summary: Create rule
      description: This API creates a rule for the user. Devices specified in the rule must exist. The caller must own, or have rights to, the device. Actions can be included at rule-creation time, or they can be added to the rule later.
      operationId: create-rule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - RAW_BODY
              properties:
                RAW_BODY:
                  type: string
                  format: json
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule:
                    type: object
                    properties:
                      rule_uuid:
                        type: string
                        example: 3aedf330-4d19-11f1-97c5-3b132d297a3a
                      name:
                        type: string
                        example: Blue LED Rule
                      description:
                        type: string
                        example: Trigger Blue LED actions based on property value
                      expression:
                        type: string
                        example: DATAPOINT(AC000W000340333,Blue_LED) == 1
                      is_enabled:
                        type: boolean
                        example: true
                        default: true
                      is_abstract:
                        type: boolean
                        example: false
                        default: true
                      is_template:
                        type: boolean
                        example: false
                        default: true
                      action_ids:
                        type: array
                        items:
                          type: string
                          example: 4633da41-4d03-11f1-b2b0-d1744a9d4c09
                      parameters:
                        type: object
                        properties: {}
                      user_uuid:
                        type: string
                        example: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      created_at:
                        type: string
                        example: '2026-05-11T09:10:18.661Z'
                      updated_at:
                        type: string
                        example: '2026-05-11T09:10:18.661Z'
                      created_by:
                        type: string
                        example: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      updated_by:
                        type: string
                        example: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      facility_uuid:
                        type: string
                        example: ''
              examples:
                Created:
                  summary: Created
                  value:
                    rule:
                      rule_uuid: 3aedf330-4d19-11f1-97c5-3b132d297a3a
                      name: Blue LED Rule
                      description: Trigger Blue LED actions based on property value
                      expression: DATAPOINT(AC000W000340333,Blue_LED) == 1
                      is_enabled: true
                      is_abstract: false
                      is_template: false
                      action_ids:
                      - 4633da41-4d03-11f1-b2b0-d1744a9d4c09
                      parameters: {}
                      user_uuid: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      created_at: '2026-05-11T09:10:18.661Z'
                      updated_at: '2026-05-11T09:10:18.661Z'
                      created_by: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      updated_by: b02ce872-42d8-11f1-8aa5-f6a43ee69b74
                      facility_uuid: ''
          description: Created
        '400':
          content: {}
          description: Bad Request
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Rules.json
    get:
      summary: Get rules
      description: 'This API returns an array of rules.


        The query parameters are optional. However, if you set one, then you must set the other, too.'
      operationId: get-rules
      parameters:
      - name: type
        in: query
        description: 'Rule type: device or user.'
        schema:
          type: string
      - name: id
        in: query
        description: DSN or user uuid.
        schema:
          type: string
      - name: oemId
        in: query
        description: Valid OEM ID. <br>Mandatory for Ayla admin users. <br>Optional for OEM users, if provided, the value should always be their OEM ID.
        schema:
          type: string
      - name: tag
        in: query
        description: Valid value is 'subscription' or 'SUBSCRIPTION'.
        schema:
          type: string
      - name: is_internal
        in: query
        description: Possible values are as follows:<br><b>true</b> - Only internal rules will be available in the response.<br><b>false</b> - Only non-internal rules will be available in the response.</br><b>When not specified</b> - all rules will be available in the response.
        schema:
          type: boolean
      - name: paginated
        in: query
        description: true or 1 means results will be paginated.
        schema:
          type: boolean
      - name: per_page
        in: query
        description: Maximum number of records per page.
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: API result page number that you want to display.
        schema:
          type: integer
          format: int32
      - name: sort_order
        in: query
        description: Ascending (asc) or descending (desc).
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    rules:
                    - rule_uuid: 7e89xxxxx20-11f1-bdfe-43dd63608803
                      name: Blue LED ON Rule
                      expression: DATAPOINT(AC000W000340333,Blue_LED) == 1
                      is_enabled: true
