                  value: "[\n    {\n        \"schedule_action\": {\n            \"active\": true,\n            \"at_end\": false,\n            \"at_start\": true,\n            \"base_type\": \"boolean\",\n            \"in_range\": false,\n            \"name\": \"Blue_LED\",\n            \"schedule_id\": 61,\n            \"key\": 64,\n            \"value\": 1\n        }\n    }\n]\n"
