        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"schedule\": {\n      \"active\": true,\n      \"day_occur_of_month\": [\n        1\n      ],\n      \"days_of_month\": [\n        1\n      ],\n      \"days_of_week\": [\n        1\n      ],\n      \"device_id\": 6592588,\n      \"direction\": \"input\",\n      \"display_name\": \"schedule1\",\n      \"duration\": null,\n      \"end_date\": \"\",\n      \"end_time_each_day\": \"\",\n      \"fixed_actions\": false,\n      \"interval\": null,\n      \"months_of_year\": [\n        1\n      ],\n      \"name\": \"schedule1\",\n      \"start_date\": \"\",\n      \"start_time_each_day\": \"21:00:00\",\n      \"time_before_end\": null,\n      \"utc\": false,\n      \"version\": \"1\",\n      \"key\": 36250927,\n      \"metadata\": {\n        \"sunrise_sunset\": true\n      },\n      \"schedule_actions\": []\n    }\n  },\n{...}\n]"
