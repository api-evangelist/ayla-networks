  /schedules/{scheduleId}/schedule_actions.json:
    post:
      summary: Create schedule action
      description: 'This API creates a schedule action.


        **NOTE**: Specify value to just one of the following parameters in the request body: in_range,'
      operationId: create-schedule-action
      parameters:
      - name: scheduleId
        in: path
        description: Unique schedule identifier
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule_action:
                  properties:
                    name:
                      type: string
                      description: The name of the property this schedule_action is related with.
                    type:
                      type: string
                      description: The schedule action type. Currently only the "SchedulePropertyAction" type is supported.
                      default: SchedulePropertyAction
                    base_type:
                      type: string
                      description: 'Base type can be any one of the following: “string”, “integer”, “boolean”, or “decimal”.'
                    in_range:
                      type: boolean
                      description: Fire schedule action if the time is within the range specified.
                    at_start:
                      type: boolean
                      description: Fire schedule action if the time is at the start of the range.
                    at_end:
                      type: boolean
                      description: Fire schedule action if the time is at the end of the range.
                    value:
                      type: string
                      description: Value to be set to the property when an event fires.
                  required:
                  - name
                  - type
                  - base_type
                  - in_range
                  - at_start
                  - at_end
                  - value
                  type: object
            examples:
              New Example:
                summary: New Example
                value:
                  schedule_action:
                    type: SchedulePropertyAction
                    name: Blue_LED
                    base_type: boolean
                    in_range: true
                    at_start: false
                    at_end: false
                    value: '1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    schedule_action:
                      name: Blue_LED
                      base_type: boolean
                      schedule_id: 36250927
                      in_range: true
                      at_start: false
                      at_end: false
                      type: SchedulePropertyAction
                      active: true
                      key: 36733791
                      value: 1
              schema:
                type: object
                properties:
                  schedule_action:
                    type: object
                    properties:
                      name:
                        type: string
                        example: Blue_LED
                      base_type:
                        type: string
                        example: boolean
                      schedule_id:
                        type: integer
                        example: 36250927
                        default: 0
                      in_range:
                        type: boolean
                        example: true
                        default: true
                      at_start:
                        type: boolean
                        example: false
                        default: true
                      at_end:
                        type: boolean
                        example: false
                        default: true
                      type:
                        type: string
                        example: SchedulePropertyAction
                      active:
                        type: boolean
                        example: true
                        default: true
                      key:
                        type: integer
                        example: 36733791
                        default: 0
                      value:
                        type: integer
                        example: 1
                        default: 0
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Schedules
    get:
