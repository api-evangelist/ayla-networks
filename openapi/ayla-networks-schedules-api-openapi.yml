                            default: 0
                        days_of_month:
                          type: array
                          items:
                            type: integer
                            example: 1
                            default: 0
                        days_of_week:
                          type: array
                          items:
                            type: integer
                            example: 1
                            default: 0
                        device_id:
                          type: integer
                          example: 6592588
                          default: 0
                        direction:
                          type: string
                          example: input
                        display_name:
                          type: string
                          example: schedule1
                        duration:
                          type: string
                        end_date:
                          type: string
                          example: ''
                        end_time_each_day:
                          type: string
                          example: ''
                        fixed_actions:
                          type: boolean
                          example: false
                          default: true
                        interval:
                          type: string
                        months_of_year:
                          type: array
                          items:
                            type: integer
