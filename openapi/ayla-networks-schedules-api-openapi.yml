  /schedules/{scheduleId}/schedule_actions/find_by_name.json:
    get:
      summary: Get schedule action by name
      description: This API returns a schedule action.
      operationId: get-schedule-action-by-name
      parameters:
      - name: scheduleId
        in: path
        description: Unique schedule identifier.
        schema:
          type: string
        required: true
      - name: name
        in: query
        description: Schedule action name.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
