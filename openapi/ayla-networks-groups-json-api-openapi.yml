- sec0: []
tags:
- name: Groups.json
paths:
  /groups.json:
    post:
      summary: Create group
      description: 'This API creates a device group.


        The name field is required, but the devices object is optional.'
      operationId: create-group
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                group:
                  properties:
                    name:
                      type: string
                      description: Name of the group you want to create.
                    devices:
                      properties:
                        device_id:
                          type: array
                          description: An array of device identifiers.
                          items:
                            type: integer
                            format: int32
                      required:
                      - device_id
                      type: object
                  required:
                  - name
                  type: object
            examples: {}
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value:
                    group:
                      name: testdocument1
                      key: 28241
                      device_count: 2
                      devices:
                      - product_name: Ayla FastTrack Color Bulb
                        dsn: AC000W027329350
                        oem_model: bulb-color-dev
                        key: 6027778
                        product_class: null
                        connection_status: Offline
                      - product_name: ESP32 demo
                        dsn: AC000W030149446
                        oem_model: AylaShield
                        key: 6374901
                        product_class: demo
                        connection_status: Offline
              schema:
                type: object
                properties:
                  group:
                    type: object
                    properties:
                      name:
                        type: string
                        example: testdocument1
                      key:
                        type: integer
                        example: 28241
                        default: 0
                      device_count:
                        type: integer
                        example: 2
                        default: 0
                      devices:
                        type: array
                        items:
                          type: object
                          properties:
                            product_name:
                              type: string
                              example: Ayla FastTrack Color Bulb
                            dsn:
                              type: string
                              example: AC000W027329350
                            oem_model:
                              type: string
                              example: bulb-color-dev
                            key:
                              type: integer
                              example: 6027778
                              default: 0
                            product_class:
                              type: string
                            connection_status:
                              type: string
                              example: Offline
        '400':
          content: {}
          description: Bad Request
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Groups.json
    get:
      summary: Get groups
      description: This API returns an array of device groups.
      operationId: get-groups
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                  - group:
                      name: apitesting
                      key: 28238
                      device_count: 0
                  - group:
                      name: testdocument1
                      key: 28241
                      device_count: 3
              schema:
                type: array
                items:
                  type: object
                  properties:
                    group:
                      type: object
                      properties:
                        name:
                          type: string
                          example: apitesting
                        key:
                          type: integer
                          example: 28238
                          default: 0
                        device_count:
                          type: integer
                          example: 0
                          default: 0
        '401':
          content: {}
          description: Unauthorized
      deprecated: false
      tags:
      - Groups.json
