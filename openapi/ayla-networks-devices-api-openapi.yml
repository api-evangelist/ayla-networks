    servers:
    - url: https://ads-dev.aylanetworks.com/apiv1/
  /devices/{devId}/addr.json:
    put:
      summary: Update device address
      description: This API updates the physical address of the device.
      operationId: update-device-address
      parameters:
      - name: devId
        in: path
        description: Unique device identifier
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                addr:
                  properties:
                    street:
                      type: string
                      description: Street name.
                    city:
                      type: string
                      description: City name.
                    state:
                      type: string
                      description: State name.
                    country:
                      type: string
                      description: Country name.
                    zip:
                      type: integer
                      description: Area zip code. (Max. 9 digits).
                      format: int32
                  required: []
                  type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: "{\n\t\"addr\":{\n\t\t\"city”:“Sunnyvale”\n\t\t\"country”:”USA”\n\t\t\"state”:“CA”\n\t\t\"street”:”6 W. California Ave”\n\t\t\"zip”:”94086”\n\t}\n}"
              schema:
                type: object
                properties:
                  addr:
                    type: object
                    properties:
                      street:
                        type: string
                        example: 6 W. California Ave
                      city:
                        type: string
                        example: Sunnyvale
                      state:
                        type: string
                        example: CA
                      country:
                        type: string
                        example: USA
                      zip:
                        type: number
                        example: '94086'
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Devices
    get:
      summary: Get device address
      description: This API returns the physical address of the specified device.
      operationId: get-device-address
      parameters:
      - name: devId
        in: path
        description: Unique device identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: "{\n\t\"addr\":{\n\t\t\"city”:“Sunnyvale”\n\t\t\"country”:”USA”\n\t\t\"state”:“CA”\n\t\t\"street”:”6 W. California Ave”\n\t\t\"zip”:”94086”\n\t}\n}"
              schema:
                type: object
                properties:
                  addr:
                    type: object
                    properties:
                      street:
                        type: string
                        example: 6California Ave
                      city:
                        type: string
                        example: Sunnyvale
                      state:
                        type: string
                        example: CA
                      country:
                        type: string
                        example: USA
                      zip:
                        type: number
                        example: '94086'
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Devices
    delete:
      summary: Delete device address
      description: This API removes the physical address details of the device.
      operationId: delete-device-address
      parameters:
      - name: devId
        in: path
        description: Unique device identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json: {}
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Devices
    servers:
    - url: https://ads-dev.aylanetworks.com/apiv1/
  /devices/{devId}/cmds/factory_reset.json:
    put:
      summary: Factory reset device
      description: This API resets device settings to factory defaults.
      operationId: factory-reset-device-id114
      parameters:
      - name: devId
        in: path
        description: Unique device identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json: {}
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Devices
    servers:
    - url: https://ads-dev.aylanetworks.com/apiv1/
  /devices/{devId}/connection_history/page/{page_no}/limit/{per_page}/field/{field_name}/order/{order_by}.json:
    get:
      summary: Get connection history
      description: This API is used to get the connection status history for a given device.
      operationId: get-connection-history
      parameters:
      - name: devId
        in: path
        description: Unique device identifier.
        schema:
          type: string
        required: true
      - name: page_no
        in: path
        description: Page number
        schema:
          type: integer
          format: int32
        required: true
      - name: per_page
        in: path
        description: Number of entries(records) in a page.
        schema:
          type: integer
          format: int32
        required: true
      - name: field_name
        in: path
        description: It can be either "event_time" or "status". The mentioned field name is used to order the result.
        schema:
          type: string
        required: true
      - name: order_by
        in: path
        description: It can be either "desc" or "asc".
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"connection_history\": {\n      \"event_time\": \"2022-01-03T08:30:22Z\",\n      \"status\": \"Initializing\"\n    }\n  },\n  {\n    \"connection_history\": {\n      \"event_time\": \"2022-01-03T08:30:22Z\",\n      \"status\": \"Online\"\n    }\n  },\n  {\n    \"connection_history\": {\n      \"event_time\": \"2022-01-03T10:23:52Z\",\n      \"status\": \"Offline\"\n    }\n  },\n  {\n    \"connection_history\": {\n      \"event_time\": \"2022-01-03T10:25:48Z\",\n      \"status\": \"Initializing\"\n    }\n  },\n  {\n    \"connection_history\": {\n      \"event_time\": \"2022-01-03T10:25:49Z\",\n      \"status\": \"Online\"\n    }\n  }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    connection_history:
                      type: object
                      properties:
                        event_time:
                          type: string
                          example: '2022-01-03T08:30:22Z'
                        status:
                          type: string
                          example: Initializing
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Devices
    servers:
    - url: https://ads-dev.aylanetworks.com/apiv1/
  /devices/{devId}/identify.json:
    put:
      summary: Identify Zigbee node
      description: This API sends a command to the specified Zigbee node (in a Gateway), setting the node to ON or OFF for the specified number of seconds.
      operationId: identify-zigbee-node-id115
      parameters:
      - name: devId
        in: path
        description: Device ID of Zigbee node.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: Specifies whether to turn the device on or off.
                  default: 'On'
                time:
                  type: integer
                  description: Specifies a delay in seconds before turning the device on/off.
                  default: 60
                  format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: On_0x00158D0000658577
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: On_0x00158D0000658577
        '401':
          content: {}
          description: Unauthorized
