openapi: 3.2.0
info:
  title: Ayla Networks Devices API
  version: '1.0'
  description: 'Operations tagged Devices across 2 of this provider''s published API definitions: ayla-networks-device-service-openapi.yml, ayla-networks-factory-proxy-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://ads-dev.aylanetworks.com/apiv1/
- url: https://api-dev.aylanetworks.com/devicefactory/v1/
security:
- sec0: []
tags:
- name: Devices
paths:
  /devices/find_by_role_label.json:
    get:
      summary: Get associated devices by role
      description: This API returns an array of device objects by role.
      operationId: get-associated-devices-1
      parameters:
      - name: role
        in: query
        description: Role label name.
        required: true
        schema:
          type: string
      - in: query
        name: key
        schema:
          type: string
        required: true
      - in: query
        name: value
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                  - role_label:
                      id: 9239
                      role_name: EndUser
                      description: end user
                      label: {}
                      role_label_hierarchies: []
              schema:
                type: array
                items:
                  type: object
                  properties:
                    role_label:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 9239
                          default: 0
                        role_name:
                          type: string
                          example: EndUser
                        description:
                          type: string
                          example: end user
                        label:
                          type: object
                          properties: {}
                        role_label_hierarchies:
                          type: array
                          items:
                            type: object
                            properties: {}
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Devices
    servers:
    - url: https://ads-dev.aylanetworks.com/apiv1/
  /devices/find_by_user_email.json:
    get:
      summary: Get associated devices by email
      description: 'This API returns an array of devices registered to the user account associated with the email specified in the query parameter. Here is an example of response data:


        [

        {

        "device": {

        "dsn": "AC000W000000001",

        "id": 1234001

        }

        },

        {

        "device": {

        "dsn": "AC000W000000002",

        "id": 1234002

        }

        }

        ]'
      operationId: get-associated-devices-by-email
      parameters:
      - name: email
        in: query
        description: The email associated with a user account.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                  - device:
                      id: 6246263
                      dsn: AC000W031210552
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device:
                      type: object
                      properties:
                        id:
                          type: string
                        dsn:
                          type: string
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Devices
    servers:
    - url: https://ads-dev.aylanetworks.com/apiv1/
  /devices/register.json:
    get:
      summary: Get registrable device
      description: This API returns the device that matches the query parameters and is eligible for registration. If multiple devices match the query parameters, only the most recently connected device is returned.
      operationId: get-registrable-device
      parameters:
      - name: ip
        in: query
        description: IP address.
        schema:
          type: string
      - name: dsn
        in: query
        description: Must be an exact match. If specified, other parameters are ignored.
        schema:
          type: string
      - name: regtype
        in: query
        description: 'Registration type: [Same-LAN, Button-Push, Dsn, Node]. <br>For <b>Same-LAN</b>(default) - device should not be already registered.<br>For <b>Button-Push</b> - button must have been pushed within the last 2 min.'
        required: true
        schema:
          type: string
      - name: time
        in: query
        description: Time span in minutes.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                OK:
                  summary: OK
                  value:
                    device:
                      dsn: AC000W0000048200
                      lan_ip: 190.120.3.12
                      model: AY001PRT2
                      oem_model: AY001PRT2
                      product_name: carrier 22
                      connected_at: '2021-01-12T16:23:28Z'
                      product_class: ''
              schema:
                type: object
                properties:
                  device:
                    type: object
                    properties:
                      dsn:
                        type: string
                        example: AC000W0000048200
                      lan_ip:
                        type: string
                        example: 190.120.3.12
                      model:
                        type: string
                        example: AY001PRT2
                      oem_model:
                        type: string
                        example: AY001PRT2
                      product_name:
                        type: string
                        example: carrier 22
                      connected_at:
                        type: string
                        example: '2021-01-12T16:23:28Z'
                      product_class:
                        type: string
                        example: ''
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Devices
    servers:
    - url: https://ads-dev.aylanetworks.com/apiv1/
  /devices/search.json:
    get:
      summary: Search devices
      description: This API returns details of the devices matching the search criteria. The criteria can include device properties and values.
      operationId: search-devices
      parameters:
      - name: property_name
        in: query
        description: Property name.
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: Property value.
        required: true
        schema:
          type: string
      - name: oem_id
        in: query
        description: Unique OEM identifier.
        required: true
        schema:
          type: string
      - name: oem_model
        in: query
        description: OEM model.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number
        schema:
          type: string
      - name: per_page
        in: query
        description: Maximum number of records per page.
        schema:
          type: string
      - name: is_forward_page
        in: query
        description: For first page or next page requests, set to true.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    previous_page: null
                    previous: null
                    next_page: null
                    is_forward: null
                    next: null
                    devices:
                    - device:
                        product_name: karpalo
                        dsn: AC000W000000516
                        sw_version: bc 2.3-eng 09/21/15 11:43:07 ID marko/0400e85 dev
                        ip: 76.220.56.140
                        connected_at: '2015-09-22T08:49:02Z'
                        user_id: null
                        user_uuid: null
                        lat: '37.3688'
                        lng: '-122.036'
                        locality: '94087'
                        homekit: null
                        dealer: null
                        facility_uuid: null
                        manuf_model: USI-eval
                        transport_type: http
              schema:
                type: object
                properties:
                  previous_page:
                    type: number
                  previous:
                    type: number
                  next_page:
                    type: number
                  is_forward:
                    type: string
                  next:
                    type: string
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        device:
                          type: object
                          properties:
                            product_name:
                              type: string
                              example: karpalo
                            dsn:
                              type: string
                              example: AC000W000000516
                            sw_version:
                              type: string
                              example: bc 2.3-eng 09/21/15 11:43:07 ID marko/0400e85 dev
                            ip:
                              type: string
                              example: 76.220.56.140
                            connected_at:
                              type: string
                              example: '2015-09-22T08:49:02Z'
                            user_id:
                              type: string
                            user_uuid:
                              type: string
                            lat:
                              type: string
                              example: '37.3688'
                            lng:
                              type: string
                              example: '-122.036'
                            locality:
                              type: string
                              example: '94087'
                            homekit:
                              type: string
                            dealer:
                              type: string
                            facility_uuid:
                              type: string
                            manuf_model:
                              type: string
                              example: USI-eval
                            transport_type:
                              type: string
                              example: http
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Devices
    servers:
    - url: https://ads-dev.aylanetworks.com/apiv1/
  /devices/{devId}.json:
    delete:
      summary: Unregister device
      description: This API unregisters the specified device from the caller.
      operationId: unregister-a-device
      parameters:
      - name: devId
        in: path
        description: Unique device identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content: {}
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Devices
    get:
      summary: Get device by ID
      description: This API returns information about the device specified by device ID (devId).
      operationId: get-device-by-device-id
      parameters:
      - name: devId
        in: path
        description: Unique device identifier.
        schema:
          type: string
        required: true
      responses:
