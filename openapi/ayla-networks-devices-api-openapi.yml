  /devices/reserve.json:
    post:
      summary: Reserve DSNs
      description: 'This API reserves a range of DSNs. It is intended for module and gateway manufacturers, but not for module-based product manufacturers. The caller must be a member of the ```OEM::SoftwareOEMManufacturer```, ```OEM::Admin```, or ```Ayla::Admin``` role.


        The response data is an array of objects. Each object contains a device field:


        | Name | Type | Description |

        |--|--|--|

        | device | object | Device objects |


        The Device object contains the following fields:


        | Name | Type | Example |

        |--|--|--|

        | dsn | string | AC000W123456789 |

        | public_key | string | -----BEGIN RSA PUBLIC KEY-----MIIBC...AQAB-----END RSA PUBLIC KEY----- |'
      operationId: reserve-dsns
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - model
              - count
              - reserve_oem
              properties:
                model:
                  type: string
                  description: The ```model``` field specifies the module model name (e.g. AY001MTP1 ) not the ```oem_model``` name (e.g. ledevb). A device reports the module model name to the Ayla Device Service (ADS) at connection time.
                count:
                  type: integer
                  description: Specifies the number of DSNs to reserve.
                  format: int32
                reserve_oem:
                  type: string
                  description: Specifies the oem id.
