        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device:
                  properties:
                    product_name:
                      type: string
                      description: Product name.
                  required:
                  - product_name
                  type: object
      responses:
