                          type: integer
                          example: 422615
                          default: 0
                        oem:
                          type: string
                          example: 0dfc7900
                        url:
                          type: string
                          example: http://indge.s1.in/ws/web/post_ip.php
                        username:
                          type: string
                          example: user1
                        password:
                          type: string
                          example: password1
                        on_connect:
                          type: boolean
                          example: true
                          default: true
                        ip_change:
                          type: boolean
                          example: false
                          default: true
                        registration_type:
                          type: string
                          example: Same-LAN
                        lanip_enabled:
                          type: boolean
                          example: false
                          default: true
                        lanip_keep_alive:
                          type: string
                        lanip_lifetime:
                          type: string
                        lanip_auto_sync:
                          type: boolean
                          example: false
                          default: true
                        version:
                          type: string
                          example: '*'
                        product_name:
                          type: string
                        template_type:
                          type: string
                        gateway_type:
                          type: string
                        cluster_id:
                          type: string
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        homekit:
                          type: string
                        template_key:
                          type: string
                        sunrise_sunset_supported:
                          type: boolean
                          example: false
                          default: true
                        connection_priority:
                          type: array
                          items:
                            type: object
                            properties: {}
                        sync_freq:
                          type: string
                        classification:
                          type: integer
        '401':
          content: {}
          description: Unauthorized
      tags:
      - Templates.json
