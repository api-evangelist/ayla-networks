- url: https://ads-dev.aylanetworks.com/apiv1/
security:
- sec0: []
tags:
- name: Templates.json
paths:
  /templates.json:
    post:
      summary: Create template
      description: This API creates a template.
      operationId: create-template
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  properties:
                    gateway_type:
                      type: string
                      description: 'Mandatory if "template_type" is "Gateway". The possible values are: Zigbee or Generic.'
                    registration_type:
                      type: string
                      description: 'Registration method for the device. The possible values are: Same-LAN, Button-Push, AP-Mode, Display, Dsn, or None.'
                    template_type:
                      type: string
                      description: 'Type of template. The possible values are: Wifi, Node, Gateway, Cluster, Sensor, or Remote.'
                    visibility:
                      type: string
                      description: 'Visibility of the template. The possible values are: public, private, or oem.'
                    connection_priority:
                      type: array
                      description: 'Priority order of local connection type(s). The possible values are: [], [“LAN“], [“BLE“],  [“LAN”, ”BLE“], or [“BLE”, “LAN“]. Where, [] is the default value.'
                      items:
                        type: string
                    lanip_auto_sync:
                      type: boolean
                      description: Indicates whether the status of the device will echo the datapoints to cloud and other clients.
                    lanip_keep_alive:
                      type: integer
                      description: Mandatory if "connection_priority" is not empty and should be greater than 29.
                      format: int32
                    lanip_lifetime:
                      type: integer
                      description: Mandatory if "connection_priority" is not empty and should be greater than 0.
                      format: int32
                    name:
                      type: string
                      description: Name of the template.
                    description:
                      type: string
                      description: Brief info about the template.
                    model:
                      type: string
                      description: OEM Model to which this template applies or Cluster ID in case of Cluster template.
                    sunrise_sunset_supported:
                      type: boolean
                    sync_freq:
                      type: integer
                      description: Use this parameter to set the time duration (in seconds) for which the sensor device should be marked as SelfOffline. Please note, this parameter is applicable only for sensor-type templates.
                      format: int32
                    classification:
                      type: integer
                      description: Specifies the device classification. Valid values are 1 or 2, where 2 indicates a native MQTT device.
                  required:
                  - registration_type
                  - template_type
                  - visibility
                  - name
                  - description
                  - model
                  type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                OK:
                  value: "{\n  \"template\": {\n    \"id\": 20017363\n  }\n}"
                  summary: OK
              schema:
                type: object
                properties:
                  template:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 20017363
                        default: 0
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '422':
          content: {}
          description: Unprocessable Entity
      tags:
      - Templates.json
    get:
      summary: Get templates
      description: This API is used to fetch all the templates.
      operationId: create-template-1
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                OK:
                  value:
                  - template:
                      id: 100
                      visibility: oem
                      name: SinaWS_v3
                      description: Sina Weather Station
                      tags: null
                      model: SinaTest
                      product_class: WeatherStation
                      user_id: 42
                      oem: 0dfc7900
                      url: http://cdapp.sina.cn/weatherstation/web/post_ip.php
                      username: user1
                      password: password1
                      on_connect: true
                      ip_change: false
                      registration_type: Same-LAN
                      lanip_enabled: false
                      lanip_keep_alive: null
                      lanip_lifetime: null
                      lanip_auto_sync: false
                      version: '*'
                      product_name: null
                      template_type: null
                      gateway_type: null
                      cluster_id: null
                      created_at: null
                      updated_at: null
                      homekit: null
                      template_key: null
                      sunrise_sunset_supported: false
                      connection_priority: []
                      sync_freq: null
                      classification: 1
                  - template:
                      id: 104
                      visibility: oem
                      name: demo_file 2.2
                      description: Demo
                      tags: null
                      model: ledevb
                      product_class: demo
                      user_id: 4481
