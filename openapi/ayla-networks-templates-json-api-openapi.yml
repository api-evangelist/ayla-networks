                      url: null
                      username: null
                      password: null
                      on_connect: false
                      ip_change: false
                      registration_type: Same-LAN
                      lanip_enabled: true
                      lanip_keep_alive: 30
                      lanip_lifetime: 15552000
                      lanip_auto_sync: true
                      version: ababndoned
                      product_name: Ayla EVB
                      template_type: Wifi
                      gateway_type: null
                      cluster_id: null
                      created_at: null
                      updated_at: '2017-08-17T18:45:32Z'
                      homekit: null
                      template_key: null
                      sunrise_sunset_supported: false
                      connection_priority:
                      - LAN
                      sync_freq: null
                      classification: 1
                  summary: OK
              schema:
                type: array
                items:
                  type: object
                  properties:
                    template:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 100
                          default: 0
                        visibility:
                          type: string
                          example: oem
                        name:
                          type: string
                          example: S1WS_v3
                        description:
                          type: string
                          example: S1 Weather Station
                        tags:
                          type: string
                        model:
                          type: string
                          example: S1Test
                        product_class:
                          type: string
                          example: WeatherStation
