    get:
      summary: Get OEMs
      description: This API is used to get details of all the OEMs.
      operationId: get-oems
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: 2
                    name: Ayla
                    module_manufacturer: false
                    phone_as_gateway: true
                    homekit: true
                    gdpr: false
                    premium_reports: true
                    logo: null
                    file_name: null
                    mobile_logs_enabled: true
                    lockout_duration: null
                    oem_id: 0dfc7900
                    contact_info_name: Adrian Caceres
                    contact_info_phone: '4088309844'
                    contact_info_email: adrian@aylanetworks.com
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 2
                    default: 0
                  name:
                    type: string
                    example: Ayla
                  module_manufacturer:
                    type: boolean
                    example: false
                    default: true
                  phone_as_gateway:
                    type: boolean
                    example: true
                    default: true
                  homekit:
                    type: boolean
                    example: true
                    default: true
                  gdpr:
                    type: boolean
                    example: false
                    default: true
                  premium_reports:
                    type: boolean
                    example: true
                    default: true
                  logo:
                    type: string
                  file_name:
                    type: string
                  mobile_logs_enabled:
                    type: boolean
                    example: true
                    default: true
                  lockout_duration:
                    type: string
                  oem_id:
                    type: string
                    example: 0dfc7900
                  contact_info_name:
                    type: string
                    example: Adrian Caceres
                  contact_info_phone:
                    type: string
                    example: '4088309844'
                  contact_info_email:
                    type: string
                    example: adrian@aylanetworks.com
