openapi: 3.2.0
info:
  title: device-service Notifications API
  version: '1.0'
servers:
- url: https://ads-dev.aylanetworks.com/apiv1/
security:
- sec0: []
tags:
- name: Notifications
paths:
  /notifications/{notId}.json:
    get:
      summary: Get notification
      description: This API returns the specified notification.
      operationId: get-notification
      parameters:
      - name: notId
        in: path
        description: Unique notification identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    notification:
                      id: 14516297
                      url: http://www.aylanetworks.com
                      username: aylaun
                      password: aylapw
                      notification_type: ip_change
                      message: IP Change
                      threshold: 0
                      device_key: 5462379
                      device_nickname: null
                      user_id: 3637421
                      user_uuid: 6024f1c2-38fb-11eb-bc1f-0a580ae90a86
                      asset: true
                      active: true
              schema:
                type: object
                properties:
                  notification:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 14516297
                        default: 0
                      url:
                        type: string
                        example: http://www.aylanetworks.com
                      username:
                        type: string
                        example: aylaun
                      password:
                        type: string
                        example: aylapw
                      notification_type:
                        type: string
                        example: ip_change
                      message:
                        type: string
                        example: IP Change
                      threshold:
                        type: integer
                        example: 0
                        default: 0
                      device_key:
                        type: integer
                        example: 5462379
                        default: 0
                      device_nickname:
                        type: string
                      user_id:
                        type: integer
                        example: 3637421
                        default: 0
                      user_uuid:
                        type: string
                        example: 6024f1c2-38fb-11eb-bc1f-0a580ae90a86
                      asset:
                        type: boolean
                        example: true
                        default: true
                      active:
                        type: boolean
                        example: true
                        default: true
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Notifications
    put:
      summary: Update notification
      description: 'This API updates the specified notification.


        See createNotifications for field descriptions. Include only the fields to update in the request data object.'
      operationId: update-notification
      parameters:
      - name: notId
        in: path
        description: Unique notification identifier
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notification:
                  properties:
                    url:
                      type: string
                      description: Complete URL to which the property value must be forwarded. **Mandatory** only for on_connect and ip_change types
                    username:
                      type: string
                      description: Username for basic auth if required for the service.
                    password:
                      type: string
                      description: Password for basic auth required for the service.
                    notification_type:
                      type: string
                      description: 'One of the following strings: “on_connect”, “ip_change”, “on_connection_lost”, “on_connection_restore".'
                    message:
                      type: string
                      description: Custom message for this notification type.
                    threshold:
                      type: integer
                      description: number of seconds for which the condition must be active before notification is sent. Minimum is 300 seconds.<br> **Mandatory** for on_connection_lost and on_connection_restore types.
                      format: int32
                    device_nickname:
                      type: string
                      description: User friendly device name.
                  type: object
            examples: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    notification:
                      id: 14516296
                      url: http://www.aylanetworks.com
                      username: aylaun
                      password: aylapw
                      notification_type: ip_change
                      message: '[Device Notification] '
                      threshold: 0
                      device_key: 5462379
                      device_nickname: null
                      user_id: 3637421
                      user_uuid: 6024f1c2-38fb-11eb-bc1f-0a580ae90a86
                      asset: true
                      active: true
              schema:
                type: object
                properties:
                  notification:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 14516296
                        default: 0
                      url:
                        type: string
                        example: http://www.aylanetworks.com
                      username:
                        type: string
                        example: aylaun
                      password:
                        type: string
                        example: aylapw
                      notification_type:
                        type: string
                        example: ip_change
                      message:
                        type: string
                        example: '[Device Notification] '
                      threshold:
                        type: integer
                        example: 0
                        default: 0
                      device_key:
                        type: integer
                        example: 5462379
                        default: 0
                      device_nickname:
                        type: string
                      user_id:
                        type: integer
                        example: 3637421
                        default: 0
                      user_uuid:
                        type: string
                        example: 6024f1c2-38fb-11eb-bc1f-0a580ae90a86
                      asset:
                        type: boolean
                        example: true
                        default: true
                      active:
                        type: boolean
                        example: true
                        default: true
        '401':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value: '{}'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Forbidden:
                  summary: Forbidden
                  value: '{}'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Not Found:
                  summary: Not Found
                  value: '{}'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Unprocessable Entity:
                  summary: Unprocessable Entity
                  value: '{}'
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Notifications
    delete:
      summary: Delete notification
      description: This API deletes the specified notification.
      operationId: delete-notification
      parameters:
      - name: notId
        in: path
        description: Unique notification identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: OK
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Notifications
  /notifications/{notId}/notification_apps.json:
    post:
      summary: Create notification app
      description: 'This API creates a notification app associated with the specified notification.


        | Name | Type | Description |

        |--|--|--|

        | app_type | string (255 chars) | Type of notification. The API supports the following request data objects: ```email```, ```sms```, ```push_ios```, ```push_android```, ```push_android_fcm```, ```push_baidu```. |

        | nickname | string (255 chars) | User-friendly notification name |

        | username | string (255 chars) | Used as greeting in notification |

        | email | string (255 chars) | Destination email address |

        | email_template_id | string (255 chars) | Custom email template id |

        | email_subject | string (255 chars) | Email subject line for email template |

        | email_body_html | string (10000 characters) | Email body for email template |

        | message | string (10000 characters) | Additional text for the notification |

        | country_code | string (255 chars) | Country code for phone number |

        | phone_number | string (255 chars) | 10 digit phone number |

        | registration_id | integer | Registration ID linking phone/tablet to notification service |

        | application_id | integer | Application ID linking phone/tablet to notification service |

        | channel_id | string (255 chars) | Channel ID linking phone/tablet to Baidu notification service |

        | push_sound |string (255 chars) | Sound file name (mp3) associated with this notification |

        | push_mdata | string (255 chars) | Additional details or key-value pairs |

        | data | string (255 chars) | Additional details or key-value pairs |'
      operationId: create-notification-app
      parameters:
      - name: notId
        in: path
        description: Unique notification identifier.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - RAW_BODY
              properties:
                RAW_BODY:
                  type: string
                  format: json
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value: "//Example response for email notification\n{\n  \"notification_app\": {\n    \"id\": 7,\n    \"notification_id\": 15000005,\n    \"app_type\": \"email\",\n    \"nickname\": \"test\",\n    \"notification_app_parameters\": {\n      \"username\": \"abc\",\n      \"email\": \"abc@aylanetworks.com\"\n    }\n  }\n}"
              schema:
                type: object
                properties:
                  notification_app:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 7
                        default: 0
                      notification_id:
                        type: integer
                        example: 15000005
                        default: 0
                      app_type:
                        type: string
                        example: email
                      nickname:
                        type: string
                        example: test
                      notification_app_parameters:
                        type: object
                        properties:
                          username:
                            type: string
                            example: abc
                          email:
                            type: string
                            example: abc@aylanetworks.com
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Notifications
    get:
      summary: Get notification apps
      description: This API returns an array of notification apps associated with the specified notification regardless of who created the apps.
      operationId: get-notification-app
      parameters:
      - name: notId
        in: path
        description: Unique notification identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"notification_app\": {\n      \"id\": 14916607,\n      \"notification_id\": 14516296,\n      \"app_type\": \"email\",\n      \"nickname\": \"emailnote\",\n      \"notification_app_parameters\": {\n        \"username\": \"aylaun\",\n        \"email\": \"aylatest@aylan\",\n        \"contact_id\": \"533064\"\n      }\n    }\n  }\n{\n\t\"notification_app\":{...}\n\t}\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    notification_app:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 14916607
                          default: 0
                        notification_id:
                          type: integer
                          example: 14516296
                          default: 0
                        app_type:
                          type: string
                          example: email
                        nickname:
                          type: string
                          example: emailnote
                        notification_app_parameters:
                          type: object
                          properties:
                            username:
                              type: string
                              example: aylaun
                            email:
                              type: string
                              example: aylatest@aylan
                            contact_id:
                              type: string
                              example: '533064'
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Notifications
