info:
  title: device-service Batch Datapoints.json API
  version: '1.0'
servers:
- url: https://ads-dev.aylanetworks.com/apiv1/
security:
- sec0: []
tags:
- name: Batch Datapoints.json
paths:
  /batch_datapoints.json:
    post:
      summary: Create datapoints
      description: 'Creates multiple datapoints in a single API request across one or more devices and properties. Each datapoint is processed independently, allowing valid datapoints to be created even when other datapoints in the same request fail.

        **Note**: A maximum of 5 metadata entries is supported per datapoint.'
      operationId: create-datapoints
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value:
                  - dsn: AC000W030149446
                    name: Blue_LED
                    status: 201
                    datapoint:
                      updated_at: '2026-04-21T06:58:08Z'
                      created_at: '2026-04-21T06:58:08Z'
                      echo: false
                      metadata:
                        key1: string
                      generated_at: null
                      generated_from: null
                      value: 1
              schema:
                type: array
                items:
                  type: object
                  properties:
                    dsn:
                      type: string
                      example: AC000W030149446
                    name:
                      type: string
                      example: Blue_LED
                    status:
                      type: integer
                      example: 201
                      default: 0
                    datapoint:
                      type: object
                      properties:
                        updated_at:
                          type: string
                          example: '2026-04-21T06:58:08Z'
                        created_at:
                          type: string
                          example: '2026-04-21T06:58:08Z'
                        echo:
                          type: boolean
                          example: false
                          default: true
                        metadata:
                          type: object
                          properties:
                            key1:
                              type: string
                              example: string
                        generated_at:
                          type: string
                          format: date
                        generated_from:
                          type: string
                        value:
                          type: integer
                          example: 1
                          default: 0
        '202':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Accepted - For Native MQTT Devices:
                  summary: Accepted - For Native MQTT Devices
                  value: 'Datapoint accepted but queued for delivery to the device (device currently online, delivered asynchronously) '
          description: Accepted
        '206':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Partial Content:
                  summary: Partial Content
                  value: "The batch contains a combination of successful and failed datapoints. \nReview the status field for each item to determine its individual result."
          description: Partial Content
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                batch_datapoints:
                  type: array
                  items:
                    properties:
                      dsn:
                        type: string
                        description: DSN of the device that owns the property.
                      name:
                        type: string
                        description: Name of the property on the specified device.
                      datapoint:
                        type: object
                        properties:
                          value:
                            type: string
                            description: Datapoint value. The accepted format depends on the property's base type.
                          metadata:
                            type: object
                            description: The metadata associated with the datapoint.
                            properties:
                              key1:
                                type: string
                              key2:
                                type: string
                        required:
                        - value
                        description: Datapoint payload for the item.
                    type: object
                    required:
                    - dsn
                    - name
                    - datapoint
              required:
              - batch_datapoints
            examples:
              New Example:
                summary: New Example
                value:
                  batch_datapoints:
                  - dsn: AC000W000000001
                    name: temperature
                    datapoint:
                      value: '72.5'
                      metadata:
                        key1: value1
                  - dsn: AC000W000000001
                    name: humidity
                    datapoint:
                      value: '40.1'
                  - dsn: AC000W000000002
                    name: power
                    datapoint:
                      value: '1'
      tags:
      - Batch Datapoints.json
