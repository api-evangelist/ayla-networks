paths:
  /diagnostic_states.json:
    get:
      summary: Get diagnostic states
      description: This API returns diagnostic states created by a rule with a given ID, or by an action with a given ID, or for a given DSN.
      operationId: get-diagnostic-states
      parameters:
      - name: rule_uuid
        in: query
        description: Rule UUID.
        schema:
          type: string
      - name: current_only
        in: query
        description: Indicates whether you want current or historical data.
        schema:
          type: boolean
      - name: paginated
        in: query
        description: Selected "true" to get paginated result.
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          format: int32
          default: null
      - name: per_page
        in: query
        description: Maximum number of records per page.
        schema:
          type: integer
          format: int32
      - name: dsn
        in: query
        description: Device serial number.
        schema:
          type: string
      - name: action_id
        in: query
        description: Action ID.
        schema:
          type: string
