paths:
  /devices.json:
    post:
      summary: Register device
      description: This API registers the specified device to the caller.
      operationId: register-device
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device:
                  properties:
                    dsn:
                      type: string
                      description: Device serial number. This parameter is required for all types except for “Display” and “AP-Mode".
                    regtoken:
                      type: string
                      description: Registration token obtained from the device. This parameter is required for “Same-LAN” and “Display” registration type, optional in other cases.
                    setup_token:
                      type: string
                      description: Setup token generated by application. This parameter is required only for "AP-Mode" registration type, optional in other cases.
                    ip:
                      type: string
                      description: Public IP address of the device to be registered.
                    lat:
                      type: string
                      description: Latitude of the device.
                    lng:
                      type: string
                      description: Longitude of the device.
                  required: []
                  type: object
                  description: Device object.
            examples: {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  device:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 7433523
                        default: 0
                      product_name:
                        type: string
                        example: ESP32 demo
                      model:
                        type: string
                        example: AY008ESP1
                      dsn:
                        type: string
                        example: AC000W041714026
                      oem:
                        type: string
                        example: 0dfc7900
                      oem_model:
                        type: string
                        example: demo-esp32
                      connect_path:
                        type: string
                      unique_hardware_id:
                        type: string
                      hwsig:
                        type: string
                        example: mac-b0a732c80dd0
                      sw_version:
                        type: string
                        example: ADA 3.0.10-eng ecr6600-ECR6600F_V0.0.1B01 2026-03-02 17:21:52 edward/module/177c85866b
                      user_id:
                        type: integer
                        example: 101010
                        default: 0
                      user_uuid:
                        type: string
                        example: 63d92ce0-0118-11e6-9b1b-0ab3f06930bb
                      template_id:
