                                type: string
                                example: bc 0.5 09/18/11 11:20:56 ID jre/not/eb2617e+
                              mac:
                                type: string
                              lan_ip:
                                type: string
                                example: 192.168.2.101
                              connected_at:
                                type: string
                                example: '2014-04-02T18:26:20Z'
                              key:
                                type: integer
                                example: 3
                                default: 0
                              lan_enabled:
                                type: boolean
                                example: true
                                default: true
                              connection_priority:
                                type: array
                                items:
                                  type: string
                                  example: LAN
                              registered:
                                type: boolean
                                example: false
                                default: true
                              user_id:
                                type: string
                              user_uuid:
                                type: string
                              template_id:
                                type: string
                              connection_status:
                                type: string
                              lat:
                                type: string
                                example: '37.3486'
                              lng:
                                type: string
                                example: '-121.951'
                              locality:
                                type: string
                                example: '95050'
                              homekit:
                                type: string
                              oem_id:
                                type: string
                                example: '12'
                              dealer:
                                type: string
                              facility_uuid:
                                type: string
                              imei:
                                type: string
                    transport_type:
                      type: string
                  title: Eample Response When Pagination = True
