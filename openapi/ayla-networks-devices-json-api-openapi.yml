    get:
      summary: Get devices
      description: 'This API returns an array of device objects.This API returns an array of device objects in one of two formats depending on whether you include the paginated query parameter. If the `paginated` parameter is not passed, the API returns data using Format A, and heeds the other query parameters, most notably order_by, order, and user_uuid:**Format A**

        { "previous_page": null, "next_page": 2, "current_page_number": 1, "start_count_on_page": 1, "end_count_on_page": 5, "total": 9, "devices": [ { "device": {} }, { "device": {} } ]}

        If the `paginated` parameter is not passed, the API returns data using Format B, data that includes only devices owned by or shared with the caller, and ignores the other query parameters including order_by:**Format B**

        [ { "device": {} }, { "device": {} }]

        In general, paginated=1 is recommended because you can control quantity (per_page) and order (order_by).**NOTE**:The presence of the `connection_priority` key in the response body is based on the below conditions on query parameters.* If (paginated = true) or (paginated = false & only_dsns = false & dsns_list = false & show_optimal = false), then the `connection_priority` key will be present in the response body.* If (paginated = false) & (only_dsns = true or dsns_list = true or show_optimal = true), then the `connection_priority` key will not be present in the response body.'
      operationId: get-associated-devices
      parameters:
      - name: paginated
        in: query
        description: true or 1 means results will be paginated.
        schema:
          type: boolean
      - name: page
        in: query
        description: Page Number.
        schema:
          type: string
      - name: per_page
        in: query
        description: Maximum number of records per page.
        schema:
          type: string
      - name: order_by
        in: query
        description: Field name. Based on this value, the result will be sorted.
        schema:
          type: string
      - name: order
        in: query
        description: Ascending (asc) or descending (desc).
        schema:
          type: string
      - name: user_uuid
        in: query
        description: Unique user identifier.
        schema:
          type: string
      - name: connected_at_after
        in: query
        description: Connected on or after this date.
        schema:
          type: string
      - name: connected_at_before
        in: query
        description: Connected on or before this date.
        schema:
          type: string
      - name: activated_at_after
        in: query
        description: Activated on or after this date.
        schema:
          type: string
      - name: activated_at_before
        in: query
        description: Activated on or before this date.
        schema:
          type: string
      - name: status
        in: query
        description: 'Device status: online, offline, or initializing.'
        schema:
          type: string
      - name: virtual
        in: query
        description: to get virtual devices list, select "true".
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    previous_page:
                      type: string
                    next_page:
                      type: integer
                      example: 2
                      default: 0
                    current_page_number:
                      type: integer
                      example: 1
                      default: 0
                    start_count_on_page:
                      type: integer
                      example: 1
                      default: 0
                    end_count_on_page:
                      type: integer
                      example: 100
                      default: 0
                    total:
                      type: integer
                      example: 445568
                      default: 0
                    devices:
                      type: array
                      items:
                        type: object
                        properties:
                          device:
                            type: object
                            properties:
                              product_name:
                                type: string
                                example: AC000W000000003
                              model:
                                type: string
                                example: AY001MTP2
                              dsn:
                                type: string
