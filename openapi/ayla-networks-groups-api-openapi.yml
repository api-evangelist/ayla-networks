openapi: 3.2.0
info:
  title: device-service Groups API
  version: '1.0'
servers:
- url: https://ads-dev.aylanetworks.com/apiv1/
security:
- sec0: []
tags:
- name: Groups
paths:
  /groups/{groupId}.json:
    get:
      summary: Get group
      description: This API returns the specified group.
      operationId: get-group-by-id
      parameters:
      - name: groupId
        in: path
        description: Unique group identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    group:
                      name: testdocument1
                      key: 28241
                      device_count: 3
                      devices:
                      - product_name: Ayla FastTrack Color Bulb
                        dsn: AC000W027329350
                        oem_model: bulb-color-dev
                        key: 6027778
                        product_class: null
                        connection_status: Offline
                      - product_name: ESP32 demo
                        dsn: AC000W030149446
                        oem_model: AylaShield
                        key: 6374901
                        product_class: demo
                        connection_status: Offline
                      - product_name: Ayla Shield
                        dsn: AC000W000340317
                        oem_model: AylaShield
                        key: 6613724
                        product_class: demo
                        connection_status: Offline
              schema:
                type: object
                properties:
                  group:
                    type: object
                    properties:
                      name:
                        type: string
                        example: testdocument1
                      key:
                        type: integer
                        example: 28241
                        default: 0
                      device_count:
                        type: integer
                        example: 3
                        default: 0
                      devices:
                        type: array
                        items:
                          type: object
                          properties:
                            product_name:
                              type: string
                              example: Ayla FastTrack Color Bulb
                            dsn:
                              type: string
                              example: AC000W027329350
                            oem_model:
                              type: string
                              example: bulb-color-dev
                            key:
                              type: integer
                              example: 6027778
                              default: 0
                            product_class:
                              type: string
                            connection_status:
                              type: string
                              example: Offline
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Groups
    put:
      summary: Rename group
      description: This API renames the specified group.
      operationId: rename-group
      parameters:
      - name: groupId
        in: path
        description: Unique group identifier.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                group:
                  properties:
                    name:
                      type: string
                      description: Group name.
                  required:
                  - name
                  type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    group:
                      name: testing
                      key: 28238
                      device_count: 1
                      devices:
                      - product_name: ESP32 demo
                        dsn: AC000W034505639
                        oem_model: demo-esp32
                        key: 7533917
                        product_class: demo
                        connection_status: Offline
              schema:
                type: object
                properties:
                  group:
                    type: object
                    properties:
                      name:
                        type: string
                        example: testing
                      key:
                        type: integer
                        example: 28238
                        default: 0
                      device_count:
                        type: integer
                        example: 1
                        default: 0
                      devices:
                        type: array
                        items:
                          type: object
                          properties:
                            product_name:
                              type: string
                              example: ESP32 demo
                            dsn:
                              type: string
                              example: AC000W034505639
                            oem_model:
                              type: string
                              example: demo-esp32
                            key:
                              type: integer
                              example: 7533917
                              default: 0
                            product_class:
                              type: string
                              example: demo
                            connection_status:
                              type: string
                              example: Offline
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Groups
    delete:
      summary: Delete group by ID
      description: This API deletes the specified group.
      operationId: delete-group
      parameters:
      - name: groupId
        in: path
        description: Unique group identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: OK
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_id:
                      type: integer
                      example: 573994
                      default: 0
                    prop_id:
                      type: integer
                      example: 38462928
                      default: 0
                    prop_value:
                      type: integer
                      example: 1
                      default: 0
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Groups
  /groups/{groupId}/batched_datapoints.json:
    post:
      summary: Create datapoints in group
      description: This API updates the values of the specified properties for all the devices in the specified device group.
      operationId: create-datapoints-in-group
      parameters:
      - name: groupId
        in: path
        description: Unique group identifier.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - RAW_BODY
              properties:
                RAW_BODY:
                  type: string
                  format: json
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                  - device_id: 6374901
                    prop_id: 29963843
                    prop_value: 100
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_id:
                      type: integer
                      example: 536728
                      default: 0
                    prop_name:
                      type: string
                      example: test1
                    prop_value:
                      type: integer
                      example: 234
                      default: 0
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Groups
  /groups/{groupId}/datapoints.json:
    post:
      summary: Create datapoint in group
      description: This API updates the value of a single property for all the devices in the specified device group.
      operationId: create-datapoints-in-group-1
      parameters:
      - name: groupId
        in: path
        description: Unique group identifier
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - RAW_BODY
              properties:
                RAW_BODY:
                  type: string
                  format: json
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: "[\n\t{\n\t\t\"device_id\":536728,\n\t\t\"prop_name\":\"string_input_tp_1\",\n\t\t\"prop_value\": 0\n\t}\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_id:
                      type: integer
                      example: 536728
                      default: 0
                    prop_name:
                      type: string
                      example: string_input_tp_1
                    prop_value:
                      type: integer
                      example: 0
                      default: 0
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Groups
    get:
      summary: Get datapoints in group
      description: This API returns an array of datapoints for the specified properties of all devices in the specified device group.
      operationId: get-datapoints-in-group
      parameters:
      - name: groupId
        in: path
        description: Unique group identifier.
        schema:
          type: string
        required: true
      - name: property_names
        in: query
        description: Property names.
        required: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: "{ \n  \"datapoints\": { \n    \"devices\": { \n      \"device\": [ \n        { \n          \"id\": 183750, \n          \"properties\": { \n            \"property\": [ \n              { \n                \"id\": 9744633, \n                \"name\": \"Blue_LED\", \n                \"value\": 0 \n              }, \n              { \n                \"id\": 9744637, \n                \"name\": \"Green_LED\", \n                \"value\": 1 \n              } \n            ] \n          } \n        }, \n        { \n          \"id\": 183751, \n          \"properties\": { \n            \"property\": [ \n              { \n                \"id\": 5393459, \n                \"name\": \"Blue_LED\", \n                \"value\": 0 \n              }, \n              { \n                \"id\": 5393463, \n                \"name\": \"Green_LED\", \n                \"value\": 1 \n              } \n            ] \n          } \n        } \n      ] \n    } \n  } \n}\n"
              schema:
                type: object
                properties:
                  datapoints:
                    type: object
                    properties:
                      devices:
                        type: object
                        properties:
                          device:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 183750
                                  default: 0
                                properties:
                                  type: object
                                  properties:
                                    property:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          id:
                                            type: integer
                                            example: 9744633
                                            default: 0
                                          name:
                                            type: string
                                            example: Blue_LED
                                          value:
                                            type: integer
                                            example: 0
                                            default: 0
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Groups
  /groups/{groupId}/devices.json:
    post:
      summary: Add device to group
      description: This API adds a device to a group.
      operationId: add-device-to-group
      parameters:
      - name: groupId
        in: path
        description: Unique group identifier.  (Group key value)
        schema:
          type: integer
          format: int32
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - device_id
              properties:
                device_id:
                  type: integer
                  description: Device ID.
                  format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    group:
                      name: testdocument1
                      key: 28241
                      device_count: 3
                      devices:
                      - product_name: Ayla FastTrack Color Bulb
                        dsn: AC000W027329350
                        oem_model: bulb-color-dev
                        key: 6027778
                        product_class: null
                        connection_status: Offline
                      - product_name: ESP32 demo
                        dsn: AC000W030149446
                        oem_model: AylaShield
                        key: 6374901
                        product_class: demo
                        connection_status: Offline
                      - product_name: Ayla Shield
                        dsn: AC000W000340317
                        oem_model: AylaShield
                        key: 6613724
                        product_class: demo
                        connection_status: Offline
              schema:
                type: object
                properties:
                  group:
                    type: object
                    properties:
                      name:
                        type: string
                        example: testdocument1
                      key:
                        type: integer
                        example: 28241
                        default: 0
                      device_count:
                        type: integer
                        example: 3
                        default: 0
                      devices:
                        type: array
                        items:
                          type: object
                          properties:
                            product_name:
                              type: string
                              example: Ayla FastTrack Color Bulb
                            dsn:
                              type: string
                              example: AC000W027329350
                            oem_model:
                              type: string
                              example: bulb-color-dev
                            key:
                              type: integer
                              example: 6027778
                              default: 0
                            product_class:
                              type: string
                            connection_status:
                              type: string
                              example: Offline
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Groups
  /groups/{groupId}/devices/{devId}.json:
    delete:
      summary: Remove device from group
      description: This API removes a device from a group.
      operationId: remove-device-from-group
      parameters:
      - name: groupId
        in: path
        description: Unique group identifier.
        schema:
          type: string
        required: true
      - name: devId
        in: path
        description: Unique device identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    group:
                      name: testdocument1
                      key: 28241
                      device_count: 2
                      devices:
                      - product_name: ESP32 demo
                        dsn: AC000W030149446
                        oem_model: AylaShield
                        key: 6374901
                        product_class: demo
                        connection_status: Offline
                      - product_name: Ayla Shield
                        dsn: AC000W000340317
                        oem_model: AylaShield
                        key: 6613724
                        product_class: demo
                        connection_status: Offline
              schema:
                type: object
                properties:
                  group:
                    type: object
                    properties:
                      name:
                        type: string
                        example: testdocument1
                      key:
                        type: integer
                        example: 28241
                        default: 0
                      device_count:
                        type: integer
                        example: 2
                        default: 0
                      devices:
                        type: array
                        items:
                          type: object
                          properties:
                            product_name:
                              type: string
                              example: ESP32 demo
                            dsn:
                              type: string
                              example: AC000W030149446
                            oem_model:
                              type: string
                              example: AylaShield
                            key:
                              type: integer
                              example: 6374901
                              default: 0
                            product_class:
                              type: string
                              example: demo
                            connection_status:
                              type: string
                              example: Offline
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Groups
