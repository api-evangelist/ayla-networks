    get:
      summary: Get destinations
      description: This API returns an array of message service destinations.
      operationId: get-destinations
      parameters:
      - name: type
        in: query
        description: 'Message destination type: email, push, or sms.'
        schema:
          type: string
      - name: paginated
        in: query
        description: By default pagination is enabled.
        schema:
          type: boolean
      - name: per_page
        in: query
        description: Number destinations to be displayed on a single page. The maximum value can be 100.
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: Enter the page number you want to view.
        schema:
          type: integer
          format: int32
      - name: sort_by
        in: query
        description: Parameter name. Based on this parameter, the results are sorted. By default, "created_at" is considered.
        schema:
          type: string
      - name: order_by
        in: query
        description: 'Possible values: <b>asc</b> or <b>desc</b> <br>By default, the result is displayed in descending (desc) order.'
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    total: 6
                    total_pages: 6
                    previous_page: null
                    current_page_number: 1
                    next_page: 2
                    start_count_on_page: 1
                    end_count_on_page: 1
