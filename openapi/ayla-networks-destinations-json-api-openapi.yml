    post:
      summary: Create destination
      description: 'This API creates a message service destination. The following types are supported:


        | Type | Provider | Required Fields |

        |--|--|--|

        | email | smtp | type, body or message_template_id, deliver_to |

        | sms | twilio, yunpian | type, body, country_code, deliver_to |

        | push | fcm, apns | type, app_id, body, deliver_to, meta_data |'
      operationId: create-destination
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
                  description: Request body.
                  format: json
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                email notification:
                  value:
                    destination:
                      uuid: 9553f0f0-d0c7-4048-bbcf-c1d8a816f2b4
                      body: Leak detector battery is low.
                      country_code: '+91'
                      deliver_to: '9100008888'
                      oem_id: 0dfc7900
                      provider: twilio
                      rule_uuid: null
                      action_uuid: null
                      dsn: null
                      repeat_freq: 30
                      created_at: '2026-05-12T06:49:51Z'
