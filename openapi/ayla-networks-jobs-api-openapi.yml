openapi: 3.2.0
info:
  title: Ayla Networks Jobs API
  version: '1.0'
  description: 'Operations tagged Jobs across 2 of this provider''s published API definitions: ayla-networks-iot-command-center-openapi.yml, ayla-networks-iot-command-center-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://icc-dev.aylanetworks.com/icc/v1/
- url: https://icc-dev.aylanetworks.com/icc/v2/
security:
- sec0: []
tags:
- name: Jobs
paths:
  /jobs:
    post:
      summary: Create job
      description: This API creates a job.
      operationId: create-job
      parameters:
      - name: oem
        in: query
        description: Unique OEM identifier
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - type_id
              - filter_id
              - exec_method
              - delivery_option
              properties:
                name:
                  type: string
                  description: Job name.
                type_id:
                  type: integer
                  description: 'Job type identifier number. Any one of the following: <br> 1: Set properties <br> 2: Reset devices <br> 3: Debug devices <br> 4: OTA <br> 5: File transfer'
                  format: int32
                filter_id:
                  type: integer
                  description: Unique filter identifier number
                  format: int32
                exec_method:
                  type: string
                  description: 'Execution method: "ONE_TIME" or "CONTINUOUS".'
                delivery_option:
                  type: string
                  description: 'Delivery option: "SYSTEM_PUSH" or "USER_CONSENT".'
                description:
                  type: string
                  description: Short description of the job.
                job_metadata:
                  properties:
                    key:
                      type: string
                      description: Metadata key name.
                    value:
                      type: string
                      description: Metadata key value.
                  required: []
                  type: object
                  description: List of data objects.
                retries:
                  type: integer
                  description: Number of retry if one of the action of the device is failure, how many times should retry the action.
                  default: 0
                  format: int32
                action_payload:
                  type: string
                  description: An object that is used for job action, the payload depends on different type of action.
                  format: json
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: 204575
                    name: Api testing1
                    description: ''
                    status: CREATED
                    retries: 0
                    payload: null
                    type_id: 1
                    filter:
                      id: 300846
