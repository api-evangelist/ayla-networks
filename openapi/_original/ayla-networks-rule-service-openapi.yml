    get:
      summary: Get actions
      description: This API returns an array of actions visible to the caller.
      operationId: get-actions
      parameters:
      - name: user_uuid
        in: query
        description: Valid end user identifier.
        schema:
          type: string
      - name: is_internal
        in: query
        description: Possible values are as follows:<br><b>true</b> - Only actions which are associated to internal rules will be available in the response.<br><b>false</b> - All actions which are associated to non internal rules + actions which are not associated to any rules will be available in the response.</br><b>When not specified</b> - All actions which are not associated to any rules + all actions which are associated to internal rules + all actions which are associated to non internal rules will be available in the response.
        schema:
          type: boolean
      - name: paginated
        in: query
        description: true or 1 means results will be paginated.
        schema:
          type: boolean
      - name: per_page
        in: query
        description: Maximum number of records per page.
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: API result page number that you want to display.
        schema:
          type: integer
          format: int32
      - name: order
        in: query
        description: Ascending (asc) or descending (desc).
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
