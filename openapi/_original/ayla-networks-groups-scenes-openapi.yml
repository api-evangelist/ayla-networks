paths:
  /collections.json:
    get:
      summary: Retrieve collections
      description: This API is used to retrieve the list of collections belonging to the user.
      operationId: retrieve-collections
      parameters:
      - name: type
        in: query
        description: Type of the collection. It can be either "GROUP" or "SCENE". The parameter value is case insensitive.
        schema:
          type: string
      - name: paginated
        in: query
        description: Indicate if pagination is required or not. True or fale.
        schema:
          type: boolean
      - name: per_page
        in: query
        description: Indicates number of items to be displayed per page.
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: Page number to be displayed.
        schema:
          type: integer
          format: int32
      - name: sort_by
        in: query
        description: Field name. Based on this field, the results are sorted.
        schema:
          type: string
          default: created_at
      - name: order_by
        in: query
        description: asc or desc
        schema:
          type: string
      - name: custom_attribute
        in: query
        description: 'Key-value pair. The API will return all the collections matching this "custom_attribute" key-value pair. Below are the examples for the "custom_attribute" parameter value:<br>1. color~blue<br>2. color~%23F08080.<br>*NOTE*: The key-value pair is separated by the “~” symbol and should be encoded.'
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    collections:
                    - collection_uuid: 8ae79d4b-bc40-4bc3-889e-7cbddda0c0ad
                      name: Good Morning
                      type: SCENE
                      is_active: true
                      devices:
                      - dsn: TESTDSN_787294_001
                        product_name: TESTDEVICE_001
                        oem_model: ledevb
                        lan_enabled: false
                        connected_at: '2020-07-06T11:08:03Z'
                        connection_status: Offline
                        states:
                        - property_name: integer_output_tp1
                          base_type: integer
                          property_value: '1008'
                        - property_name: string_input_tp1
                          base_type: string
                          property_value: '1008'
                      - dsn: TESTDSN_763168_004
