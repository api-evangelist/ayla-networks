  /collections/shares.json:
    post:
      summary: Share group or scene
      description: 'Use this API to share a group or scene with your household member.


        Use the parameter "resource_id" to specify the group or scene that you want to share. This parameter takes UUID of the group/scene as its value.


        To share all collections (all the groups or/and scenes), specify "*all_collections*" as the value to the "resource_id" parameter.


        **NOTE**: When you share a group/scene, its child resources will also be shared with the selected household member.'
      operationId: share-group-or-scene
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                share:
                  type: object
                  properties:
                    user_email:
                      type: string
                      description: Household member email with whom primary user going to share Collections.
                    resource_id:
                      type: string
                      description: ID of the collections.
                    operation:
                      type: string
                      description: Operation which will be performed by the household on resource.
                    start_date_at:
                      type: string
                      description: Start date of sharing
                    end_date_at:
                      type: string
                      description: The end date of sharing.
                    email_template_id:
                      type: string
                      description: Custom email template when sharing collections. If no / invalid template is supplied, then default template will be used to send the emails.
                  required:
                  - user_email
                  - resource_id
                  - operation
            examples: {}
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
