paths:
  /devices/reserve.json:
    post:
      summary: Reserve DSNs
      description: "This API reserves a range of DSNs. It is intended for module and gateway manufacturers, but not for module-based product manufacturers. The caller must be a member of the ```OEM::SoftwareOEMManufacturer```, ```OEM::Admin```, or ```Ayla::Admin``` role.\n\nThe response data is an array of objects. Each object contains a device field:\n\n| Name | Type | Description |\n|--|--|--|\n| device | object | Device objects |\n\nThe Device object contains the following fields:\n\n| Name | Type | Example | \n|--|--|--|\n| dsn | string | AC000W123456789 |\n| public_key | string | -----BEGIN RSA PUBLIC KEY-----MIIBC...AQAB-----END RSA PUBLIC KEY----- |"
      operationId: reserve-dsns
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - model
              - count
              - reserve_oem
              properties:
                model:
                  type: string
                  description: The ```model``` field specifies the module model name (e.g. AY001MTP1 ) not the ```oem_model``` name (e.g. ledevb). A device reports the module model name to the Ayla Device Service (ADS) at connection time.
                count:
                  type: integer
                  description: Specifies the number of DSNs to reserve.
                  format: int32
                reserve_oem:
                  type: string
                  description: Specifies the oem id.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        dsn:
                          type: string
                          example: AC000W048698393
                        public_key:
                          type: string
                          example: '-----BEGIN RSA PUBLIC KEY-----

                            xxxxxxxxxZrSc95QnbLwUwUtBv

                            KBt0w1GSv4+ZqzXWHlA8miO48UMC9OcraIlBEFRBnNjQUhrknYFGcTxlz7n+yF1tPxj9IY+Q9mvg

                            LEC/y6AK5KTgzBhz5ctd7VqN8EqodN/T1h2vgdZ11OSwh4sui6qcyMvmXjgufnxX/vZPyufGaq9n

                            6QaS4JFrxAPtel1rA3zpHKv3+z9fC+1FuzJx1Bpl7shZxVAnLJAt/t6MVE2fXJOAhMxElJhnGoX9

                            Ww+25ROeN7606Co87IkkYE/Rz//PkN4DUHnkxxxxxxxxB

                            -----END RSA PUBLIC KEY-----'
              examples:
                OK:
                  summary: OK
                  value:
                    devices:
                    - dsn: AC000W048698393
                      public_key: '-----BEGIN RSA PUBLIC KEY-----

                        xxxxxxxxxZrSc95QnbLwUwUtBv

                        KBt0w1GSv4+ZqzXWHlA8miO48UMC9OcraIlBEFRBnNjQUhrknYFGcTxlz7n+yF1tPxj9IY+Q9mvg

                        LEC/y6AK5KTgzBhz5ctd7VqN8EqodN/T1h2vgdZ11OSwh4sui6qcyMvmXjgufnxX/vZPyufGaq9n

                        6QaS4JFrxAPtel1rA3zpHKv3+z9fC+1FuzJx1Bpl7shZxVAnLJAt/t6MVE2fXJOAhMxElJhnGoX9

                        Ww+25ROeN7606Co87IkkYE/Rz//PkN4DUHnkxxxxxxxxB

                        -----END RSA PUBLIC KEY-----'
          description: OK
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
  /devices/{dsn}/manufacture.json:
    put:
      summary: Update device manufacturer info
      description: 'This API updates a device with manufacturer information. The caller must be a member of the ```OEM::Admin``` role with ```module_manufacturer=true``` in the OEM Profile.


        The response data object has one field named device containing a Device object:


        | Name | Type | Description |

        |--|--|--|

        | device | object | Device object |


        This Device object contains the following fields:


        | Name | Type | Example |

        |--|--|--|

        | dsn | string | AC000W123456789 |

        | model | string | AY001MVM2 |

        | mac | string | 001122aabbcc |

        | hwsig | string | hwsig_5NU41 |

        | odm | string | odm_123 |

        | manuf_model | string | mfg_model_HdsbL |

        | manuf_sn | string | 16428876609579218157072732 |

        | module_sw_version | string | mfg_sw_version_1468 |

        | oem_host_version | string | 2.0 |

        | wifi_setup_key | string | abcde |

        | ads_connect_flag | integer | null |

        |dom_at | string | 2018-12-30T14:11:10Z |'
      operationId: update-devices-manufacturer-info
      parameters:
      - name: dsn
        in: path
        description: Unique device serial number.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - model
              - mac
              - hwsig
              - hom_at
              properties:
                model:
                  type: string
                  description: Model name.
                mac:
                  type: string
                  description: Mac address.
                hwsig:
                  type: string
                  description: String uniquely identifying the hardware.
                hom_at:
                  type: string
                  description: 'Represents date of manufacture. Example format: 2021/01/01 10:50:33 UTC.'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
  /devices/{dsn}/provision.json:
    put:
      summary: Update device OEM
      description: "This API updates a device with OEM information. The caller must be a member of the ```OEM::SoftwareOEMManufacturer``` role.\n\nThe response data object has one field named ```device``` containing a ```Device``` object:\n\n| Name | Type | Description |\n|--|--|--|\n| device | object | Device object |\n\nThis Device object contains the following fields:\n\n| Name | Type | Example | \n|--|--|--|\n| dsn | string | AC000W123456789 |\n| model | string | AY001MVM2 |\n| oem | string | 1234abcd |\n| mac | string | 001122aabbcc |\n| hwsig | string | hwsig_5NU41 |\n| odm | string | odm_123 |\n| manuf_model | string | mfg_model_HdsbL |\n| manuf_sn | string | 16428876609579218157072732 |\n| module_sw_version | string | mfg_sw_version_1468 |\n| oem_host_version | string | 2.0 |\n| wifi_setup_key | string | abcde | \n| ads_connect_flag | integer | null | \n| dom_at | string | 2018-12-30T14:11:10Z |"
      operationId: update-device-oem
      parameters:
      - name: dsn
        in: path
        description: Unique device serial number.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - model
              - Mac
              - manuf_model
              - hwsig
              - oem_model
              - module_sw_version
              - dom_at
              - oem_host_version
              properties:
                model:
                  type: string
                  description: model name
                Mac:
                  type: string
                  description: MAC address.
                manuf_model:
                  type: string
                  description: manufacturer model name.
                hwsig:
                  type: string
                  description: String uniquely identifying the hardware.
                oem_model:
                  type: string
                  description: OEM model name.
                module_sw_version:
                  type: string
                  description: Module software version.
                dom_at:
                  type: string
                  description: 'Date of manufacture. Example format: 2021/01/01 10:50:33 UTC'
                oem_host_version:
                  type: string
                  description: OEM host version.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '403':
          description: '403'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
        '404':
          description: '404'
          content:
            text/plain:
              examples:
                Result:
