      - name: type
        in: query
        description: 'Message destination type: email, push, or sms.'
        schema:
          type: string
      - name: paginated
        in: query
        description: By default pagination is enabled.
        schema:
          type: boolean
      - name: per_page
        in: query
        description: Number destinations to be displayed on a single page. The maximum value can be 100.
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: Enter the page number you want to view.
        schema:
          type: integer
          format: int32
      - name: sort_by
        in: query
        description: Parameter name. Based on this parameter, the results are sorted. By default, "created_at" is considered.
        schema:
          type: string
      - name: order_by
        in: query
        description: 'Possible values: <b>asc</b> or <b>desc</b> <br>By default, the result is displayed in descending (desc) order.'
