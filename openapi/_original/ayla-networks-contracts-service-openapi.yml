paths:
  /contractsdata:
    get:
      summary: Get contract data
      description: This API fetches data of the contract related to the logged in OEM.
      operationId: get-contract-data-api
      parameters:
      - name: oem_id
        in: query
        description: Logged in OEM unique identifier.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"oem_id\": \"0dfc7900\",\n    \"max_avg_annual_transaction\": \"50000\",\n    \"start_date\": \"2019-01-13\",\n    \"end_date\": \"2019-12-13\",\n    \"contract_type\": \"short_term\",\n    \"purchased_transactions\": \"5000000000\"\n  }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    oem_id:
                      type: string
                      example: 0dfc7900
                    max_avg_annual_transaction:
                      type: string
                      example: '50000'
                    start_date:
                      type: string
                      example: '2019-01-13'
                    end_date:
                      type: string
                      example: '2019-12-13'
                    contract_type:
                      type: string
                      example: short_term
                    purchased_transactions:
                      type: string
                      example: '5000000000'
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
  /reportsdata:
    get:
      summary: Get billing transaction count (Contracts Service)
      description: 'This API fetches billing transaction count.


        NOTE: Billing transaction count can be accessed using the metering service too. Please ensure you use the appropriate service API to get transaction count.'
      operationId: get-contract-data
      parameters:
      - name: report_name
        in: query
        description: Name of the report you want to fetch.
        required: true
        schema:
          type: string
      - name: aggregate_by
        in: query
        description: 'The value can be any one of the following: “day“, “month”, “week”, or “year”. The default value is "month".'
        schema:
          type: string
          default: month
      - name: start_date
        in: query
        description: Start date and end date provide duration range to be considered for fetching contract data.
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: Start date and end date provide duration range to be considered for fetching contract data.
        required: true
        schema:
          type: string
      - name: oem_model
        in: query
        description: OEM model name.
        schema:
          type: string
      - name: region_name
        in: query
        description: Name of the region for which you want to fetch the data.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: '[{"total":"122"}]'
              schema:
                type: array
                items:
                  type: object
                  properties:
                    total:
                      type: string
                      example: '122'
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
