              schema:
                type: object
                properties:
                  previous_page:
                    type: integer
                  next_page:
                    type: integer
                  current_page_number:
                    type: integer
                    example: 1
                    default: 0
                  start_count_on_page:
                    type: integer
                    example: 1
                    default: 0
                  end_count_on_page:
                    type: integer
                    example: 3
                    default: 0
                  total:
                    type: integer
                    example: 3
                    default: 0
                  dealers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: Test Dealer
                        oem_id:
                          type: string
                          example: xxxxx8
                        state:
                          type: string
                          example: Karnataka
                        uuid:
                          type: string
                          example: xxxxxxxxxxx
