                    start_count_on_page: 1
                    end_count_on_page: 3
                    total: 3
                    dealers:
                    - name: Test Dealer
                      oem_id: xxxxx8
                      state: Karnataka
                      uuid: xxxxxxxxxxx
                    - name: Test Dealer2
                      oem_id: xxxxx8
                      state: Karnataka
                      uuid: 43xxxxxx-dxx1-11xx-xxe0-2xxxxxxxxx5
                    - name: Dealer53
                      oem_id: xxxxx8
                      state: Karnataka
                      uuid: 3cxxxxxxxxxxe-xxef-9xx1-xxxxxxxx81f
