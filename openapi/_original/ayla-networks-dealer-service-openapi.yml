  /api/v1/oems/{oem_id}/dealers/dealer_roles.json:
    get:
      summary: Get dealer roles
      description: This API fetches the role(s) of the dealer(s) for the specified OEM.<br><b>Access Control</b>:<ul><li>Ayla::Admin - read</li>   <li>Ayla::Staff - read</li>   <li>OEM::Admin - read</li>   <li>OEM::Staff - read</li></ul>
      operationId: get-dealer-roles
      parameters:
      - name: oem_id
        in: path
        description: OEM ID.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"role_name\": \"Dealer::Admin\"\n  },\n  {\n    \"role_name\": \"Dealer::Manager\"\n  },\n  {\n    \"role_name\": \"Dealer::Staff\"\n  },\n  {\n    \"role_name\": \"Dealer::Supervisor\"\n  }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    role_name:
                      type: string
                      example: Dealer::Admin
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
