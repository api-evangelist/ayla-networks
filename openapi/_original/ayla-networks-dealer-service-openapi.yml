paths:
  /admin/users/{user_uuid}/associate_dealer.json:
    put:
      summary: Associate end user to a dealer
      description: This API associates an end user to a dealer with role name. <br><b>Access Control</b>:<ul><li>Ayla::Admin - read | write </li><li>Ayla::Staff - read</li><li>OEM::Admin - read | write </li> <li>OEM::Staff - read</li></ul>
      operationId: associate-end-user-to-a-dealer
      parameters:
      - name: user_uuid
        in: path
        description: UUID of the end user you want to associate to the dealer.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - dealer_uuid
              - role_name
              properties:
                dealer_uuid:
                  type: string
                  description: UUID of the dealer.
                role_name:
                  type: string
                  description: Dealer role name.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: OK
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
  /api/v1/oems/{oem_id}/dealers.json:
    get:
      summary: Get dealers
      description: 'This API fetches the list of dealers associated with the specified OEM. <br><b>Access Control</b>: <ul><li>Ayla::Admin - read | write </li>   <li>Ayla::Staff - read</li>   <li>OEM::Admin - read | write </li>   <li>OEM::Staff - read</li> </ul>'
      operationId: get-dealers
      parameters:
      - name: oem_id
        in: path
        description: OEM ID to find the OEM and fetch the list of dealers.
        schema:
          type: string
        required: true
      - name: paginated
        in: query
        description: true = Response is shown in paginated format. <br> false = Response is shown without pagination.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                With Pagination:
                  value:
                    previous_page: null
                    next_page: null
