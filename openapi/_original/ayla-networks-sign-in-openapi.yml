    post:
      summary: Sign In
      description: 'This API is used to sign a user into the Ayla IoT Cloud service. This API returns an access token and refresh token. The access token is required to use Ayla APIs. The refresh token can be used to obtain a new access token.


        To use this API, you need the user''s *email*, *password*, *app_id*, and *app_secret*.


        Follow these steps to get your *app_id* and *app_secret*:

        1. Log in to Alya Customer Dashboard.

        2. In the left navigation panel, click **OEM Profile**.

        3. Under the **Apps** tab, create a new app-id, or choose an existing app-id.'
