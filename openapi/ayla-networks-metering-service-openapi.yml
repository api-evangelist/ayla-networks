paths:
  /reportsdata:
    get:
      summary: Get billing transaction count (Metering Service)
      description: 'This API fetches billing transaction count.


        NOTE: Billing transaction count can be accessed using the contract service too. Please ensure you use the appropriate service API to get transaction count.'
      operationId: get-billing-transaction-count-metering
      parameters:
      - name: report_name
        in: query
        description: Name of the report you want to fetch. The value can be any one of the following:<br>1. Contract_Datapoint_Transactions<br>2. Contract_Datapoint_Transactions_Over_Time<br>3. Contract_Datastream_Transactions<br>4. Contract_Datastream_Transactions_Over_Time<br>5. Contract_SMS_Transactions<br>6. Contract_SMS_Transactions_Over_Time<br>7. Contract_Total_Transactions_Over_Time
        required: true
        schema:
          type: string
      - name: aggregate_by
        in: query
        description: 'The value can be any one of the following: “day“, “month”, “week”, or “year”. The default value is "month".'
        schema:
          type: string
          default: month
      - name: start_date
        in: query
        description: Start date and end date provide duration range to be considered for fetching contract data.
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: Start date and end date provide duration range to be considered for fetching contract data.
        required: true
        schema:
          type: string
      - name: oem_model
        in: query
        description: OEM model name.
        schema:
          type: string
      - name: region_name
        in: query
        description: Name of the region for which you want to fetch the data.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"total\": \"2,663,620\",\n    \"single_datapoint\": \"2,659,987\",\n    \"batch_datapoint\": \"3,633\",\n    \"total_datapoint\": \"2,663,620\"\n  }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    total:
                      type: string
                      example: 2,663,620
                    single_datapoint:
                      type: string
                      example: 2,659,987
                    batch_datapoint:
                      type: string
                      example: 3,633
                    total_datapoint:
                      type: string
                      example: 2,663,620
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
