info:
  title: user-service Ssouser API
  version: '1.0'
servers:
- url: https://user-dev.aylanetworks.com/
security:
- sec0: []
tags:
- name: Ssouser
paths:
  /api/v1/ssouser:
    put:
      description: This API is used to update an SSO (Single Sign-On) user in the system. The update operation is performed using the user’s unique uuid.
      responses:
        '202':
          content: {}
          description: Accepted
        '400':
          description: Bad Request
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Internal Server Error
          content: {}
      parameters:
      - in: header
        name: Content-Type
        schema:
          type: string
          default: application/json
      - in: header
        name: Authorization
        schema:
          type: string
          default: ''
        description: 'To create an authorization header, combine authorization_header="Authorization: " + algorithm + " " + "Credential=" + provider_app_id + "/" + scope + ", " + "SignedHeaders=" + signed_headers + ", " + "Signature=" + signature. For Example HMAC-SHA256 Credential=provider-id/user/sso/v1, SignedHeaders=x-ayla-origin-host;x-sso-date, Signature=0bb5f8614cec9270b7f2bcf0c2c6bc4739258dcb486429d58d7c8e69c93e0964.'
        required: false
      - in: header
        name: X-SSO-DATE
        schema:
          type: string
        description: 'Request timestamp in YYYYMMDD''T''HHMMSS''Z'' format . For example 20231214T152802Z. '
      - in: header
        name: X-AYLA-ORIGIN-HOST
        schema:
          type: string
        description: Origin host making the request. For example, provider.com
      operationId: put_api-v1-ssouser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: string
                  default: ''
                  description: 'Specifies the action to be performed.

                    Allowed values: UPDATE or DELETE.'
                uuid:
                  type: string
                  description: Unique identifier of the SSO user
              required:
              - operation
              - uuid
      summary: Update SSO User
      tags:
      - Ssouser
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-default: auth_token
