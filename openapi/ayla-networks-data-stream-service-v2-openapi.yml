  /streams?{destination_type}:
    get:
      summary: Get datastreams
      description: This API returns a list of datastreams created by OEM.
      operationId: get-data-streams
      parameters:
      - name: destination_type
        in: query
        description: Name of data streaming platform.
        required: true
        schema:
          type: string
      - name: oem_id
        in: query
        description: Unique OEM ID.
        schema:
          type: string
      - name: paginated
        in: query
        description: True or 1 means results will be paginated.
        schema:
          type: boolean
      - name: per_page
        in: query
        description: Maximum number of records per page.
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: The page number you want to view.
        schema:
          type: integer
          format: int32
      - name: sort_by
        in: query
        description: Sorts the result based on the specified field.
        schema:
          type: string
      - name: order_by
        in: query
        description: Sorts the result in ascending or descending order.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    total: 5
                    current_page_number: 1
                    next_page: null
                    previous_page: null
                    start_count_on_page: 1
                    end_count_on_page: 5
                    streams:
                    - name: dss_demo_jeff
                      description: Jeff's DSS Demo
                      oem_id: 0dfc7900
                      oem_model: AylaShield
                      user_uuid: 1e51c3axxxxxxxxxxxxxxxxxxx51d704787
                      stream_type: datapoint
                      destination_type: kinesis
                      rule_uuid: cbf0caxxxxxxxxxxxxxxxxxxx768174
                      is_enabled: false
                      filter:
                        property_name:
                          include:
                          - Blue_LED
                          - Green_LED
                          - Blue_button
                          - log
                      destination_metadata_details:
                        destination_uuid: e613b2xxxxxxxxxxxxxxxxxxxf484a96
                        aws_access_key: xxxxxxxxxxxxxxxxxxx
                        aws_secret_key: xxxxxxxxxxxxxxxxxxx
                        aws_region: us-east-1
                        arn: xxxxxxxxxxxxxxxxxxx
                        server_side_encryption: false
