          content: {}
          description: Unprocessable Entity
    get:
      summary: Get datastream
      description: This API returns a single datastream created by OEM.
      operationId: get-data-streams-1
      parameters:
      - name: destination_type
        in: query
        description: Name of data streaming platform.
        required: true
