            schema:
              oneOf:
              - type: object
                properties:
                  name:
                    type: string
                    description: Name of the datastream.
                  description:
                    type: string
                    description: Description of your datastream.
                  oem_id:
                    type: string
                    description: Your OEM ID.
                  destination_uuid:
                    type: string
                    description: Unique key of the stream.
                  destination_type:
                    type: string
