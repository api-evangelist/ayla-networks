        description: Unique key of the stream.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"name\": \"Test1246\",\n    \"description\": \"\",\n    \"oem_id\": \"0dfc7900\",\n    \"oem_model\": \"ledevb\",\n    \"user_uuid\": \"1234f1c2-12fb-12eb-bc1f-0a120ae90a12\",\n    \"stream_type\": \"datapoint\",\n    \"destination_type\": \"kinesis\",\n    \"rule_uuid\": \"122fa030-1234-11eb-84ed-09cc4a123456\",\n    \"is_enabled\": true,\n    \"destination_metadata_details\": {\n        \"destination_uuid\": \"xxxxxxxxxxx\",\n        \"aws_access_key\": \"xxxxxxxxxxxxxxxxxxxxx\",\n        \"aws_secret_key\": \"xxxxxxxxxxxxxxxxxxxxxxx\",\n        \"aws_region\": \"us-west-2\",\n        \"arn\": \"xxxxxxx\",\n        \"server_side_encryption\": false,\n        \"kms_key_arn\": null,\n        \"created_at\": \"2020-12-18T07:18:23.100+0000\",\n        \"updated_at\": \"2020-12-18T07:18:23.100+0000\"\n    }\n}"
