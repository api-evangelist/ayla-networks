openapi: 3.1.0
info:
  title: data-stream-service-v2
  version: '1.0'
servers:
- url: https://message-dev.aylanetworks.com/dss/v2/
security:
- sec0: []
x-readme-fauxas: true
paths:
  /streams:
    post:
      summary: Create datastream
      description: 'This API creates a new datastream. </br>**Note**: Before creating a Pub/Sub stream, contact the Ayla Customer Support team to obtain Pub/Sub topic permissions.'
      operationId: create-data-stream
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  name:
                    type: string
                    description: Unique name assigned to the stream configuration.
                  descriptio:
                    type: string
                    description: Additional information about the publication/stream
                  oem_model:
                    type: string
                    description: OEM device model associated with the stream.
                  destination_type:
                    type: string
                    description: Specifies the external destination where stream data is delivered. For AWS Kinesis, set this value to kinesis.
                  stream_type:
                    type: string
                    description: Type of publication.(For example, datapoint, connection, registration, location, activation)
                  destination_metadata_details:
                    type: object
                    description: Contains authentication and configuration details required to connect to the destination service.
                    properties:
                      aws_access_key:
                        type: string
                        description: AWS access key used to authenticate with AWS Kinesis.
                      aws_secret_key:
                        type: string
                        description: AWS secret key associated with the AWS access key.
                      arn:
                        type: string
                        description: Amazon Resource Name (ARN) of the AWS Kinesis stream destination.
                      server_side_encryption:
                        type: string
                        description: Specifies whether server-side encryption is enabled for the destination storage.
                      kms_key_arn:
                        type: string
                        description: Specifies the Amazon Resource Name (ARN) of the AWS Key Management Service (KMS) key used for server-side encryption.
                    required:
                    - arn
                    - aws_secret_key
                    - aws_access_key
                title: Streamtype=kinesis
                required:
                - name
                - oem_model
                - destination_type
                - stream_type
                - destination_metadata_details
              - type: object
                properties:
                  name:
                    type: string
                    description: Name of the stream configuration.
                  description:
                    type: string
                    description: Description providing additional information about the stream.
                  oem_model:
                    type: string
                    description: Device model for which the stream is configured.
                  destination_type:
                    type: string
                    description: Destination service type. Set this value to eventhub for Azure Event Hub.
                  stream_type:
                    type: string
                    description: Type of device data being streamed.
                  destination_metadata_details:
                    type: object
                    properties:
                      eventhub_name:
                        type: string
                        description: Name of the Azure Event Hub where datapoints are published.
                      namespace_name:
                        type: string
                        description: Name of the Azure Event Hub namespace that contains the Event Hub instance.
                      sas_key:
                        type: string
                        description: Shared Access Signature (SAS) key used for authenticating with Azure Event Hub.
                      sas_key_name:
                        type: string
                        description: Name of the Shared Access Policy associated with the SAS key.
                    description: Contains Azure Event Hub connection details required to publish datapoints.
                    required:
                    - eventhub_name
                    - namespace_name
                    - sas_key
                    - sas_key_name
                required:
                - name
                - oem_model
                - destination_type
                - stream_type
                title: Streamtype=eventhub
              - type: object
                properties:
                  name:
                    type: string
                    description: Unique name for the stream configuration.
                  description:
                    type: string
                    description: Description of the stream purpose.
                  oem_model:
                    type: string
                    description: Device model for which the stream is created.
                  destination_type:
                    type: string
                    description: Destination service where data is published. For Google Pub/Sub, use pubsub.
                  stream_type:
                    type: string
                    description: Type of device data being streamed.
                  destination_metadata_details:
                    type: object
                    properties:
                      project_id:
                        type: string
                        description: Google Cloud project ID where the Pub/Sub topic exists.
                      topic_name:
                        type: string
                        description: Name of the Pub/Sub topic where datapoints are published.
                    required:
                    - topic_name
                    - project_id
                    description: Configuration details required to connect to the destination service.
                required:
                - name
                - destination_metadata_details
                - stream_type
                - destination_type
                - oem_model
                title: Streamtype=pubsub
            examples:
              Example  request for stream_type=pubsub:
                summary: Example  request for stream_type=pubsub
                value:
                  name: ''
                  description: ''
                  oem_id: ''
                  oem_model: ''
                  destination_type: ''
                  stream_type: ''
                  destination_metadata_details:
                    project_id: ''
                    topic_name: ''
              Example request for stream_type = eventhub:
                summary: Example request for stream_type = eventhub
                value:
                  description: ''
                  destination_type: ''
                  name: ''
                  oem_model: ''
                  stream_type: ''
                  destination_metadata_details:
                    eventhub_name: ''
                    namespace_name: ''
                    sas_key: ''
                    sas_key_name: ''
              Example request data for stream_type = kinesis:
                summary: Example request data for stream_type = kinesis
                value:
                  description: ''
                  destination_type: ''
                  name: ''
                  oem_model: ''
                  stream_type: ''
                  destination_metadata_details:
                    arn: ''
                    aws_access_key: ''
                    aws_secret_key: ''
                    kms_key_arn: ''
                    server_side_encryption: ''
      responses:
        '201':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    name:
                      type: string
                      example: Test1246
                    description:
                      type: string
                      example: ''
                    oem_id:
                      type: string
                      example: 0xxxxxx0
                    oem_model:
                      type: string
                      example: ledevb
                    user_uuid:
                      type: string
                      example: 123xxxxxx90a12
                    stream_type:
                      type: string
                      example: datapoint
                    destination_type:
                      type: string
                      example: kinesis
                    rule_uuid:
                      type: string
                      example: 122fa030-xxxxxx-9cc4a123456
                    is_enabled:
                      type: boolean
                      example: true
                      default: true
                    destination_metadata_details:
                      type: object
                      properties:
                        destination_uuid:
                          type: string
                          example: xxxxxxxxxxx
                        aws_access_key:
                          type: string
                          example: xxxxxxxxxxxxxxxxxxxxx
                        aws_secret_key:
                          type: string
                          example: xxxxxxxxxxxxxxxxxxxxxxx
                        aws_region:
                          type: string
                          example: us-west-2
                        arn:
                          type: string
                          example: xxxxxxx
                        server_side_encryption:
                          type: boolean
                          example: false
                          default: true
                        kms_key_arn: {}
                        created_at:
                          type: string
                          example: 2020-12-18T07:18:23.100+0000
                        updated_at:
                          type: string
                          example: 2020-12-18T07:18:23.100+0000
                  title: Example response data for stream_type = kinesis
                - type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    oem_id:
                      type: string
                    oem_model:
                      type: string
                    user_uuid:
                      type: string
                    stream_type:
                      type: string
                    destination_type:
                      type: string
                    rule_uuid:
                      type: string
                    is_enabled:
                      type: boolean
                    destination_metadata_details:
                      type: object
                      properties:
                        stream_uuid:
                          type: string
                        eventhub_name:
                          type: string
                        namespace_name:
                          type: string
                        sas_key:
                          type: string
                        sas_key_name:
                          type: string
                        domain_name:
                          type: string
                        created_at:
                          type: string
                        updated_at:
                          type: string
                  title: Example response for stream_type = eventhub
                - type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    oem_id:
                      type: string
                    oem_model:
                      type: string
                    user_uuid:
                      type: string
                    stream_type:
                      type: string
                    destination_type:
                      type: string
                    rule_uuid:
                      type: string
                    is_enabled:
                      type: boolean
                    destination_metadata_details:
                      type: object
                      properties:
                        destination_uuid:
                          type: string
                        project_id:
                          type: string
                        topic_name:
                          type: string
                        created_at:
                          type: string
                        updated_at:
                          type: string
                  title: Example response for stream_type=pubsub
              examples:
                Example response data for stream_type = kinesis:
                  summary: Example response data for stream_type = kinesis
                  value:
                    name: Test1246
                    description: ''
                    oem_id: 0xxxxxx0
                    oem_model: ledevb
                    user_uuid: 123xxxxxx90a12
                    stream_type: datapoint
