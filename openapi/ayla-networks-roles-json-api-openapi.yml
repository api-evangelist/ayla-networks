paths:
  /api/v1/roles.json:
    post:
      summary: Create role
      description: This API is used to create a role.
      operationId: create-role
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  properties:
                    name:
                      type: string
                    can_manage_property:
                      type: boolean
                      description: It is used to differentiate the partner role from the custom role. The value "true" indicates partner role.
                  required: []
                  type: object
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": 52,\n    \"name\": \"Partner::OEM\",\n    \"permissions\": [],\n    \"can_manage_property\": true\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 52
                    default: 0
                  name:
                    type: string
                    example: Partner::OEM
                  permissions:
                    type: array
                  can_manage_property:
                    type: boolean
                    example: true
                    default: true
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Roles.json
