      summary: Create notification
      description: This API creates a notification, and associates it with the specified device.
      operationId: create-a-notification
      parameters:
      - name: devId
        in: path
        description: Unique device identifier.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notification:
                  properties:
                    url:
                      type: string
                      description: URL to which property value is forwarded. **Mandatory** for on_connect and ip_change.
                    username:
                      type: string
                      description: The username for basic authorization.
                    password:
                      type: string
                      description: Password for basic authorization.
                    notification_type:
                      type: string
                      description: on_connect, ip_change, on_connection_lost, on_connection_restore.
                    message:
                      type: string
                      description: Message to be sent with notification.
                    threshold:
                      type: integer
                      description: Represents duration (in seconds) the condition must be active before notification sent. **Mandatory** for on_connection_lost and on_connection_restore.
                      format: int32
                    device_nickname:
                      type: string
                      description: User-friendly nickname for the associated device.
                    active:
                      type: boolean
                      description: false if the notification is to be created inactive. Default value if true.
                  required:
                  - url
                  - notification_type
                  - threshold
                  type: object
              required:
              - notification
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
