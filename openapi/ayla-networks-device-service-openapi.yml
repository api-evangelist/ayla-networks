                  value: "{\n  \"previous_page\": null,\n  \"next_page\": 2,\n  \"current_page_number\": 1,\n  \"start_count_on_page\": 1,\n  \"end_count_on_page\": 100,\n  \"total\": 445568,\n  \"devices\": [\n    {\n    \"device\": {\n      \"product_name\": \"product_name\",\n      \"model\": \"AY001MSL1\",\n      \"dsn\": \"TESTDSN_6705023_000\",\n      \"oem_model\": \"ledevb-test\",\n      \"sw_version\": \"1.0\",\n      \"template_id\": 625159,\n      \"mac\": \"8a:8b:2b:15:6a:b4\",\n      \"unique_hardware_id\": \"a8:02:c4:22:0c:31\",\n      \"hwsig\": \"fypfhheq823zbxavwqt911\",\n      \"lan_ip\": null,\n      \"connected_at\": \"2026-06-08T17:20:01Z\",\n      \"key\": 7559190,\n      \"lan_enabled\": false,\n      \"connection_priority\": [],\n      \"has_properties\": true,\n      \"product_class\": \"product_class\",\n      \"connection_status\": \"Offline\",\n      \"lat\": \"39.0469\",\n      \"lng\": \"-77.4903\",\n      \"locality\": \"20149\",\n      \"device_type\": \"\
                    Wifi\",\n      \"dealer\": null,\n      \"facility_uuid\": null,\n      \"manuf_model\": \"test_mfg_model\",\n      \"oem\": \"0dfc7900\",\n      \"transport_type\": \"mqtt-native\"\n    }\n  }\n      }\n    },\n    {\n      \"device\": {\n        \"product_name\": null,\n        \"model\": \"AY001MTP1\",\n        \"dsn\": \"AC000W000000007\",\n        \"unique_hardware_id\": null,\n        \"oem_model\": null,\n        \"sw_version\": \"bc 0.7 10/05/11 17:58:18 ID jre/canary/52689fa+\",\n        \"mac\": null,\n        \"lan_ip\": \"172.31.0.137\",\n        \"connected_at\": \"2011-10-07T18:18:11Z\",\n        \"key\": 8,\n        \"lan_enabled\": false,\n        \"connection_priority\": [],\n        \"registered\": false,\n        \"user_id\": null,\n        \"user_uuid\": null,\n        \"template_id\": null,\n        \"connection_status\": null,\n        \"lat\": \"37.3486\",\n        \"lng\": \"-121.951\",\n        \"locality\": \"95050\",\n        \"homekit\": null,\n\
                    \        \"oem_id\": null,\n        \"dealer\": null,\n        \"facility_uuid\": null,\n        \"imei\": null\n      }\n    }\n  ]\n}"
                ? ''
