        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                datapoint:
                  type: object
                  description: Datapoint payload for the item.
                  properties:
                    value:
                      type: string
                      description: Datapoint value. The accepted format depends on the property's base type.
                    metadata:
                      type: object
                      description: The metadata associated with the datapoint.
                      properties:
                        key1:
                          type: string
                          description: The key-value pairs containing additional information associated with the datapoint.
                        key2:
                          type: string
                          description: The key-value pairs containing additional information associated with the datapoint.
                        key3:
                          type: string
                          description: The key-value pairs containing additional information associated with the datapoint.
                        key4:
                          type: string
                          description: The key-value pairs containing additional information associated with the datapoint.
                        key5:
                          type: string
                          description: The key-value pairs containing additional information associated with the datapoint.
                  required:
                  - value
              required:
              - datapoint
            examples:
              Example:
                summary: Example
                value:
                  datapoint:
                    value: '0'
                    metadata:
                      key1: '1'
                      key2: '123'
      responses:
        '201':
          description: Created
