      description: "This API returns an array of datapoint objects in one of two formats depending on the ```paginated``` query parameter. If ```paginated=true```, this API returns data in Format A, and heeds the ```per_page``` query parameter.\n\n**Format A**\n<pre>\n{\n  \"meta\": {\n    \"previous_page\": \"1234abcd-1234-1234-1234-ab0000000001\",\n    \"next_page\": \"1234abcd-1234-1234-1234-ab0000000005\",\n    \"current_page_number\": 1\n  },\n  \"datapoints\": [\n    {\n      \"datapoint\": {}\n    },\n    {\n      \"datapoint\": {}\n    }\n  ]\n}\n</pre>\n\nIf ```paginated=false``` or is not included in the request url, the API returns data in Format B, and heeds the ```limit``` query parameter.\n\n**Format B**\n<pre>\n[\n  {\n    \"datapoint\": {}\n  },\n  {\n    \"datapoint\": {}\n  }\n]\n</pre>"
