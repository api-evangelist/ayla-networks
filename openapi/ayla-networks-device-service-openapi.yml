    post:
      summary: Create trigger app
      description: "This API creates a trigger app associated with the specified trigger. The API supports the following request data objects: ```email```, ```sms```, ```forward```, ``` push_ios```, ```push_android```, and ```push_baidu```. See the request examples below.\n\nNote on ```forward```:  A forwarding trigger app posts json-formatted device, property, and custom data to the given REST API endpoint. The request data object sent to the specified endpoint resembles the following: \n\n<pre>\n{\n  \"device\": {\n    \"dsn\": \"AC000W000000001\",\n    \"product_name\": \"Device 1\"\n  },\n  \"property\": {\n    \"name\": \"my_prop\",\n    \"base_type\": \"integer\",\n    \"value\": \"25\",\n    \"data_updated_at\": \"2019-09-20T19:02:04Z\"\n  },\n  \"data\": \"custom text\"\n}\n</pre>\n\n| Name | Type | Description |\n|--|--|--|\n| name | string (255 chars) |email, sms, forward, push_ios, push_android, push_baidu |\n| nickname | string (255 chars) | Name of Trigger App |\n| username\
        \ | string (255 chars) | email greeting |\n| repeat_freq | integer (default=30) | repeat interval in seconds |\n| param1 | string (255 chars) | name-dependent |\n| param2\t| string (255 chars)\t| name-dependent | \n| param3\t| string (255 chars)\t| name-dependent | \n| param4\t| string (255 chars)\t| name-dependent | \n| param5\t| string (255 chars)\t| name-dependent | \n| contact_id | integer | Ayla contact id of sender. See the getContact API. |\n| push_sound | string (255 chars) | mps sound file name | \n| push_mdata | string (255 chars) | metadata key/value pairs: \"key1:value1, key2:value2\" |\n| email_template_id | string (255 chars) | ID of custom email template |\n| email_subject | string (255 chars) | Email subject line | \n| email_body_html\t| string (255 chars)\t| Email body with template tags |\n| requires_acceptance | boolean (default=false)\t| true=enables acceptance flow for SMS applications |"
      operationId: create-trigger-1
      parameters:
      - name: trigId
        in: path
        description: Unique trigger Identifier
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - RAW_BODY
              properties:
                RAW_BODY:
                  type: string
                  format: json
            examples:
              email - request data:
                value:
                  trigger_app:
                    name: email
                    username: test
                    repeat_freq: '60'
                    param1: test12@ayla.com
                    param3: test
                    email_template_id: test
                    email_subject: test
                    email_body_html: test
              forward - request data:
                value:
                  trigger_app:
                    name: forward
                    nickname: Name of Trigger App
                    repeat_freq: 0
                    param1: ''
                    param2: REST API endpoint for POST method
                    param3: username for POST basic auth
                    param4: password for POST basic auth
                    param5: custom data to send
              push_ios - request data:
                value:
                  trigger_app:
                    name: push_ios
                    nickname: Name of Trigger App
                    repeat_freq: 0
                    param1: registration ID from Apple without dashes or spaces
                    param2: key assigned to PERM
                    param3: optional message (max 100 chars)
                    push_sound: mp3 file name (max 50 chars)
                    push_mdata: metadata key/value pairs (max 50 chars)
              push_android - request data:
                value:
                  trigger_app:
                    name: push_android
                    nickname: Name of Trigger App
                    repeat_freq: 0
                    param1: registration ID from Google
                    param3: optional message (max 100 chars)
                    push_sound: mp3 file name (max 50 chars)
                    push_mdata: metadata key/value pairs (max 50 chars)
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value: "//Example response for email\n{\n  \"trigger_app\": {\n    \"key\": 5022163,\n    \"name\": \"email\",\n    \"username\": \"test\",\n    \"nickname\": null,\n    \"trigger_key\": 12867849,\n    \"contact_id\": null,\n    \"repeat_freq\": \"60\",\n    \"push_sound\": null,\n    \"push_mdata\": null,\n    \"email_template_id\": \"test\",\n    \"email_subject\": \"test\",\n    \"email_body_html\": \"test\",\n    \"param1\": \"test12@ayla.com\",\n    \"param2\": null,\n    \"param3\": \"test\",\n    \"param4\": null,\n    \"param5\": null\n  }\n}"
              schema:
                type: object
                properties:
                  trigger_app:
                    type: object
