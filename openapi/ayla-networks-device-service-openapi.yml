  /devices/{devId}/schedules.json:
    post:
      summary: Create a schedule
      description: This API creates a schedule.
      operationId: create-a-schedule
      parameters:
      - name: devId
        in: path
        description: Unique device identifier.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule:
                  properties:
                    active:
                      type: boolean
                      description: This parameter is used to pause or resume the schedule.
                      default: true
                    day_occur_of_month:
                      type: array
                      description: Array of Occurence  [1,2,3,4,5,6]. Day occurrence of month. For example, 1st Sunday or 2nd Sunday of month. As a special case, 6 means “last occurrence of the day in the month”.
                      items:
                        type: integer
                        format: int32
                    days_of_month:
                      type: array
                      description: Array of day(s) [1,2,3,4,5,6,7, 8 9....31], with 1 referring to 1st day of month, and so on. If this field is empty, the default is every day.
                      items:
                        type: integer
                        format: int32
                    days_of_week:
                      type: array
                      description: Array of day(s)  [1,2,3,4,5,6,7], with 1 referring to Sunday and so on. If this field is empty, the default is every day.
                      items:
                        type: integer
                        format: int32
                    direction:
                      type: string
                      description: Indicates whether the schedule is “input” or “output” (“to device” or “from device”).
                    display_name:
                      type: string
                      description: Display name of the schedule.
                    duration:
                      type: string
                      description: Schedule duration in seconds.
                    end_date:
                      type: string
                      description: Day when you want the schedule to stop running.
                      format: date
                    end_time_each_day:
                      type: string
                      description: End time in local time. Follow the 24 hour format (hh:mm:ss).
                      format: date
                    fixed_actions:
                      type: boolean
                      description: Indicates whether the schedule has fixed actions.
                    interval:
                      type: string
                      description: Interval in seconds.
                    months_of_year:
                      type: array
                      description: Array of month(s) [1,2,3,4,...12], with 1 referring to Jan. If this field is empty, the default is every month.
                      items:
                        type: integer
                        format: int32
                    name:
                      type: string
                      description: Schedule name.
                    start_date:
                      type: string
                      description: Day from when you want to start the schedule.
                      format: date-time
                    start_time_each_day:
                      type: string
                      description: Schedule start time in local time. Follow the 24 hour format (hh:mm:ss).
                      default: ''
                    time_before_end:
                      type: string
                      description: Time before schedule end in local time. Follow the 24 hour format (hh:mm:ss).
                    utc:
                      type: string
                      description: Indicates the schedule to be set with UTC time zone.
                      default: 'false'
                    version:
                      type: string
                      description: Schedule version.
                  required:
                  - direction
                  - name
                  - start_time_each_day
                  type: object
                schedule_actions:
                  properties:
                    name:
                      type: string
                      description: Associated property name.
                    base_type:
                      type: string
                      description: Associated property base type.
                    in_range:
                      type: boolean
                      description: The point at which to fire the action. In Range, At Start, or At End.
                    at_start:
                      type: boolean
                      description: The point at which to fire the action.  In Range, At Start, or At End.
                    at_end:
                      type: boolean
                      description: The point at which to fire the action.  In Range, At Start, or At End.
                    active:
                      type: boolean
                      description: True if this action is currently active.
                      default: true
                    key:
                      type: string
                      description: The key assigned by the cloud.
                    value:
                      type: string
                      description: Property value when an event fires.
                  required:
                  - name
                  - base_type
                  type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    schedule:
                      active: true
                      day_occur_of_month:
                      - 1
                      days_of_month:
                      - 1
                      days_of_week:
                      - 1
                      device_id: 6592588
                      direction: input
