                      items:
                        type: integer
                        format: int32
                    name:
                      type: string
                      description: Schedule name.
                    start_date:
                      type: string
                      description: Day from when you want to start the schedule.
                      format: date
                    start_time_each_day:
                      type: string
                      description: Schedule start time in local time. Follow the 24 hour format (hh:mm:ss).
                    time_before_end:
                      type: string
                      description: Time before schedule end in local time. Follow the 24 hour format (hh:mm:ss).
