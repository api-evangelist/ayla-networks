openapi: 3.1.0
info:
  title: device-service
  version: '1.0'
servers:
- url: https://ads-dev.aylanetworks.com/apiv1/
security:
- sec0: []
x-readme-fauxas: true
paths:
  /api/v1/users/{user_id}/contacts/{id}.json:
    get:
      summary: Get user contact
      description: This API returns the specified contact for the specified user.
      operationId: create-associated-user-1
      parameters:
      - name: user_id
        in: path
        description: User unique identifier.
        schema:
          type: string
        required: true
      - name: id
        in: path
        description: Unique contact identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    contact:
                      id: 549462
                      display_name: Stalin K
                      firstname: Stalin
                      lastname: Kalimuthu
                      email: stalinkalimuthu13@gmail.com
                      phone_country_code: '91'
                      phone_number: '98765432'
                      street_address: 6th street
                      zip_code: '876543'
                      country: India
                      updated_at: '2026-04-28T11:22:18Z'
                      metadata: testing
                      sms_accept: not_req
                      email_accept: not_req
                      notes: null
                      sms_notification: false
                      email_notification: false
                      push_notification: false
                      oem_models: []
              schema:
                type: object
                properties:
                  contact:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 549462
                        default: 0
                      display_name:
                        type: string
                        example: Stalin K
                      firstname:
                        type: string
                        example: Stalin
                      lastname:
                        type: string
                        example: Kalimuthu
                      email:
                        type: string
                        example: stalinkalimuthu13@gmail.com
                      phone_country_code:
                        type: string
                        example: '91'
                      phone_number:
                        type: string
                        example: '98765432'
                      street_address:
                        type: string
                        example: 6th street
                      zip_code:
                        type: string
                        example: '876543'
                      country:
                        type: string
                        example: India
                      updated_at:
                        type: string
                        example: '2026-04-28T11:22:18Z'
                      metadata:
                        type: string
                        example: testing
                      sms_accept:
                        type: string
                        example: not_req
                      email_accept:
                        type: string
                        example: not_req
                      notes:
                        type: string
                      sms_notification:
                        type: boolean
                        example: false
                        default: true
                      email_notification:
                        type: boolean
                        example: false
                        default: true
                      push_notification:
                        type: boolean
                        example: false
                        default: true
                      oem_models:
                        type: array
                        items:
                          type: object
                          properties: {}
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
  /apiv1/groups/{group_id}/assign_dealer_group.json:
    put:
      summary: Assign dealer to group
      description: This API assigns a dealer to the specified group. <br><b>Access Control</b>:<ul><li>Ayla::Admin - read | write </li><li>Ayla::Staff - read</li><li>OEM::Admin - read | write </li> <li>OEM::Staff - read</li></ul>
      operationId: assign-dealer-to-group
      parameters:
      - name: group_id
        in: path
        description: ID of the group to which you want to assign the dealer.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - dealer_uuid
              - oem_str
              properties:
                dealer_uuid:
                  type: string
                  description: UUID of the dealer.
                oem_str:
                  type: string
                  description: OEM ID.
                assign_end_user:
                  type: boolean
                  description: Use this parameter to indicate whether to include all end users or not.<br>If "True", all the end users are assigned.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: 'Dealer not found for the given uuid.

                    Group not found for the given group ID.

                    OEM not found for the given oem_id.'
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: 'oem_str is blank.

                    dealer_uuid is blank.

                    Group doesn''t belong to oem.'
      deprecated: false
  /batch_datapoints.json:
    post:
      summary: Create datapoints
      description: 'Creates multiple datapoints in a single API request across one or more devices and properties. Each datapoint is processed independently, allowing valid datapoints to be created even when other datapoints in the same request fail. <br> **Note**: A maximum of 5 metadata entries is supported per datapoint.'
      operationId: create-datapoints
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value:
                  - dsn: AC000W030149446
                    name: Blue_LED
                    status: 201
                    datapoint:
                      updated_at: '2026-04-21T06:58:08Z'
                      created_at: '2026-04-21T06:58:08Z'
                      echo: false
                      metadata:
                        key1: string
                      generated_at: null
                      generated_from: null
                      value: 1
              schema:
                type: array
                items:
                  type: object
                  properties:
                    dsn:
                      type: string
                      example: AC000W030149446
                    name:
                      type: string
                      example: Blue_LED
                    status:
                      type: integer
                      example: 201
                      default: 0
                    datapoint:
                      type: object
                      properties:
                        updated_at:
                          type: string
                          example: '2026-04-21T06:58:08Z'
                        created_at:
                          type: string
                          example: '2026-04-21T06:58:08Z'
                        echo:
                          type: boolean
                          example: false
                          default: true
                        metadata:
                          type: object
                          properties:
                            key1:
                              type: string
                              example: string
                        generated_at:
                          type: string
                          format: date
                        generated_from:
                          type: string
                        value:
                          type: integer
                          example: 1
                          default: 0
        '202':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Accepted - For Native MQTT Devices:
                  summary: Accepted - For Native MQTT Devices
                  value: 'Datapoint accepted but queued for delivery to the device (device currently online, delivered asynchronously) '
          description: Accepted
        '206':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Partial Content:
                  summary: Partial Content
                  value: "The batch contains a combination of successful and failed datapoints. \nReview the status field for each item to determine its individual result."
          description: Partial Content
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                batch_datapoints:
                  type: array
                  items:
                    properties:
                      dsn:
                        type: string
                        description: DSN of the device that owns the property.
                      name:
                        type: string
                        description: Name of the property on the specified device.
                      datapoint:
                        type: object
                        properties:
                          value:
                            type: string
                            description: Datapoint value. The accepted format depends on the property's base type.
                          metadata:
                            type: object
                            description: The metadata associated with the datapoint.
                            properties:
                              key1:
                                type: string
                              key2:
                                type: string
                        required:
                        - value
                        description: Datapoint payload for the item.
                    type: object
                    required:
                    - dsn
                    - name
                    - datapoint
              required:
              - batch_datapoints
            examples:
              New Example:
                summary: New Example
                value:
                  batch_datapoints:
                  - dsn: AC000W000000001
                    name: temperature
                    datapoint:
                      value: '72.5'
                      metadata:
                        key1: value1
                  - dsn: AC000W000000001
                    name: humidity
                    datapoint:
                      value: '40.1'
                  - dsn: AC000W000000002
                    name: power
                    datapoint:
                      value: '1'
  /devices.json:
    post:
      summary: Register device
      description: This API registers the specified device to the caller.
      operationId: register-device
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device:
                  properties:
                    dsn:
                      type: string
                      description: Device serial number. This parameter is required for all types except for “Display” and “AP-Mode".
                    regtoken:
                      type: string
                      description: Registration token obtained from the device. This parameter is required for “Same-LAN” and “Display” registration type, optional in other cases.
                    setup_token:
                      type: string
                      description: Setup token generated by application. This parameter is required only for "AP-Mode" registration type, optional in other cases.
                    ip:
                      type: string
                      description: Public IP address of the device to be registered.
                    lat:
                      type: string
                      description: Latitude of the device.
                    lng:
                      type: string
                      description: Longitude of the device.
                  required: []
                  type: object
                  description: Device object.
            examples: {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
