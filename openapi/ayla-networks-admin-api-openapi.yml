paths:
  /admin/users/{user_uuid}/associate_dealer.json:
    put:
      summary: Associate end user to a dealer
      description: 'This API associates an end user to a dealer with role name.

        Access Control:


        Ayla::Admin - read | write


        Ayla::Staff - read


        OEM::Admin - read | write


        OEM::Staff - read'
      operationId: associate-end-user-to-a-dealer
      parameters:
      - name: user_uuid
        in: path
        description: UUID of the end user you want to associate to the dealer.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - dealer_uuid
              - role_name
              properties:
                dealer_uuid:
                  type: string
                  description: UUID of the dealer.
                role_name:
                  type: string
                  description: Dealer role name.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: OK
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Admin
