  /api/v1/users/contacts.json:
    post:
      summary: Create contact
      description: 'This API creates a contact.


        ```The phone_number``` value must be contiguous digits without whitespaces, hyphens, etc.'
      operationId: create-contact
      parameters:
      - name: user_email
        in: query
        description: Case-insensitive email address of the user account with which to associate the new contact. Leave this field blank to associate the new contact with your own user account.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: The contact name to be displayed. If it is empty it will be set to “<firstname> <lastname>”.
                firstname:
                  type: string
                  description: The contact firstname.
                lastname:
                  type: string
                  description: The contact lastname.
                email:
                  type: string
                  description: The contact email.
                phone_country_code:
                  type: string
                  description: The contact phone country code. It is *mandatory* when phone_number is sent.
                phone_number:
                  type: string
                  description: The contact phone number.
                street_address:
                  type: string
                  description: The contact street address.
                zip_code:
                  type: string
                  description: The contact zip code.
                country:
                  type: string
                  description: The contact country.
                metadata:
                  type: string
                  description: The contact metadata.
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value:
                    contact:
                      id: 549462
                      display_name: Stalin K
