  /api/v1/users/shares.json:
    post:
      summary: Create share
      description: 'This API creates a single shared resource or multiple shared resources depending on the format of the request data.


        To share a resource that you own, omit the ```owner_id``` field, and use the ```user_email``` field to specify the receiver of the share.

        To (as an admin) create a share between two users, use the ```owner_id``` field to specify the owner of the shared resource, and the ```user_email``` field to specify the receiver of the share. In either case, the ```user_email``` must exist within the OEM account. If ```resource_name``` is device, then ```resource_id``` must be a dsn.


        To create multiple shared resources with a single call to this API, use an array in the request data. The following example request uses the default template:


        {

        "shares": [

        {

        "resource_name": "",

        "resource_id": "",

        "role_name": "",

        "user_email": "",

        "owner_id": 0,

        "operation": "",

        "start_date_at": "",

        "end_date_at": ""

        }

        ]

        }


        You can create a share using a specific template using the "email_template_id" parameter as a query parameter.


        **NOTE**: A user can’t have more than one share for the same resource_name, resource_id.'
      operationId: create-share
      parameters:
      - name: email_template_id
        in: query
        description: Custom email template to be used while sending the email to the target user.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                share:
                  type: array
                  items:
                    properties:
                      resource_name:
                        type: string
                        default: ''
                      resource_id:
                        type: string
                      role_name:
                        type: string
                      user_email:
                        type: string
                      owner_id:
                        type: integer
                      operation:
                        type: string
                      start_date_at:
                        type: string
                      end_date_at:
                        type: string
                    type: object
              required:
              - share
            examples: {}
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                Result:
                  value:
                    share:
                      id: 925139
                      owner_id: 5485317
                      user_id: 4254720
