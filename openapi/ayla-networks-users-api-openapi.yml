openapi: 3.2.0
info:
  title: Ayla Networks Users API
  version: '1.0'
  description: 'Operations tagged Users across 4 of this provider''s published API definitions: ayla-networks-device-service-openapi.yml, ayla-networks-iot-command-center-openapi.yml, ayla-networks-sign-in-openapi.yml, ayla-networks-user-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://ads-dev.aylanetworks.com/apiv1/
- url: https://icc-dev.aylanetworks.com/icc/v1/
- url: https://user-dev.aylanetworks.com/
tags:
- name: Users
paths:
  /api/v1/users/{user_id}/contacts/{id}.json:
    get:
      summary: Get user contact
      description: This API returns the specified contact for the specified user.
      operationId: create-associated-user-1
      parameters:
      - name: user_id
        in: path
        description: User unique identifier.
        schema:
          type: string
        required: true
      - name: id
        in: path
        description: Unique contact identifier.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    contact:
                      id: 549462
                      display_name: Stalin K
                      firstname: Stalin
                      lastname: Kalimuthu
                      email: stalinkalimuthu13@gmail.com
                      phone_country_code: '91'
                      phone_number: '98765432'
                      street_address: 6th street
                      zip_code: '876543'
                      country: India
                      updated_at: '2026-04-28T11:22:18Z'
                      metadata: testing
                      sms_accept: not_req
                      email_accept: not_req
                      notes: null
                      sms_notification: false
                      email_notification: false
                      push_notification: false
                      oem_models: []
              schema:
                type: object
                properties:
                  contact:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 549462
                        default: 0
                      display_name:
                        type: string
                        example: Stalin K
                      firstname:
                        type: string
                        example: Stalin
                      lastname:
                        type: string
                        example: Kalimuthu
                      email:
                        type: string
                        example: stalinkalimuthu13@gmail.com
                      phone_country_code:
                        type: string
                        example: '91'
                      phone_number:
                        type: string
                        example: '98765432'
                      street_address:
                        type: string
                        example: 6th street
                      zip_code:
                        type: string
                        example: '876543'
                      country:
                        type: string
                        example: India
                      updated_at:
                        type: string
                        example: '2026-04-28T11:22:18Z'
                      metadata:
                        type: string
                        example: testing
                      sms_accept:
                        type: string
                        example: not_req
                      email_accept:
                        type: string
                        example: not_req
                      notes:
                        type: string
                      sms_notification:
                        type: boolean
                        example: false
                        default: true
                      email_notification:
                        type: boolean
                        example: false
                        default: true
                      push_notification:
                        type: boolean
                        example: false
                        default: true
                      oem_models:
                        type: array
                        items:
                          type: object
                          properties: {}
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Users
      security:
      - sec0: []
    put:
      summary: Update user contact
      description: 'This API updates the specified contact for the specified user.


        Include only the field(s) you want to update.'
      operationId: update-user-contact
      parameters:
      - name: user_id
        in: path
        description: User unique identifier.
        schema:
          type: string
        required: true
      - name: id
        in: path
        description: Unique contact identifier.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - display_name
              properties:
                firstname:
                  type: string
                  description: The contact firstname.
                lastname:
                  type: string
                  description: The contact lastname.
                display_name:
                  type: string
                  description: The contact name to be displayed. If it is empty it will be set to “<firstname> <lastname>”.
                email:
                  type: string
                  description: The contact email.
                phone_country_code:
                  type: string
                  description: The contact phone country code. It is **mandatory** when phone_number is sent.
                phone_number:
                  type: string
                  description: The contact phone number.
                street_address:
                  type: string
                  description: The contact street address.
                zip_code:
                  type: string
                  description: The contact zip code.
                country:
                  type: string
                  description: The contact country.
                metadata:
                  properties:
                    key:
                      type: string
                      description: Metadata key name.
                    value:
                      type: string
                      description: Metadata value.
                  required: []
                  type: object
                  description: The contact metadata.
      responses:
        '200':
          description: Ok
          content:
            application/json:
              examples:
                Result:
                  value:
                    contact:
                      id: 549436
                      display_name: stalin K
                      firstname: Stalin
                      lastname: Kalimuthu
                      email: null
                      phone_country_code: '91'
                      phone_number: '8764378212'
                      street_address: 4th Street
                      zip_code: '560191'
                      country: India
                      updated_at: '2026-04-28T07:00:04Z'
                      metadata: '{"key"=>"testing", "value"=>"123"}'
                      sms_accept: not_req
                      email_accept: not_req
                      notes: null
                      sms_notification: false
                      email_notification: false
                      push_notification: false
                      oem_models: []
              schema:
                type: object
                properties:
                  contact:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 549436
                        default: 0
                      display_name:
                        type: string
                        example: stalin K
                      firstname:
                        type: string
                        example: Stalin
                      lastname:
                        type: string
                        example: Kalimuthu
                      email:
                        type: string
                      phone_country_code:
                        type: string
                        example: '91'
                      phone_number:
                        type: string
                        example: '8764378212'
                      street_address:
                        type: string
                        example: 4th Street
                      zip_code:
                        type: string
                        example: '560191'
                      country:
                        type: string
                        example: India
                      updated_at:
                        type: string
                        example: '2026-04-28T07:00:04Z'
                      metadata:
                        type: string
                        example: '{"key"=>"testing", "value"=>"123"}'
                      sms_accept:
                        type: string
                        example: not_req
                      email_accept:
                        type: string
                        example: not_req
                      notes:
                        type: string
                      sms_notification:
                        type: boolean
                        example: false
                        default: true
                      email_notification:
                        type: boolean
                        example: false
                        default: true
                      push_notification:
                        type: boolean
                        example: false
                        default: true
                      oem_models:
                        type: array
                        items:
                          type: object
                          properties: {}
        '400':
          content: {}
          description: Bad Request
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Users
      security:
      - sec0: []
    delete:
      summary: Delete user contact
      description: This API deletes the specified contact for the specified user.
      operationId: delete-user-contact
      parameters:
      - name: user_id
        in: path
        description: User unique identifier.
        schema:
          type: string
        required: true
      - name: id
        in: path
        description: Unique contact identifier.
        schema:
          type: string
        required: true
      responses:
        '204':
          description: No Content
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
      deprecated: false
      tags:
      - Users
      security:
      - sec0: []
    servers:
    - url: https://ads-dev.aylanetworks.com/apiv1/
  /users/device_jobs:
    put:
      summary: Decision for devices and device jobs - batch
      description: This end point is used for user consent job. Using this API, the user can cancel the ota or schedule the OTA for set of Devices.
      operationId: decision-for-devices-and-device-jobs-batch
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{

                    “succeeded”: [device_object, device_object, ...],

                    “failed”: [device_object, device_object, ...]

                    }

                    '
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Users
      security:
      - sec0: []
    get:
      summary: Get device jobs
      description: This API returns all the jobs for all the devices belonging to the user.
      operationId: get-device-jobs
      parameters:
      - name: oem_model
        in: query
        description: OEM Model name.
        schema:
          type: string
      - name: dsns
        in: query
        description: Device serial numbers. Click "Add" to specify a DSN.
        schema:
          type: array
          items:
            type: string
      - name: from
        in: query
        description: Timestamp in seconds.
        schema:
          type: integer
          format: int32
      - name: to
        in: query
        description: Timestamp in seconds.
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        description: 'Device status. You can specify multiple statuses.<br>Possible values are: PENDING, CONSENT, PROCESSING, SUCCEED, CANCELLED, FAILED, PARTIAL_FAILED, QUEUED, WAITING, or RETRY.'
        schema:
          type: array
          items:
            type: string
      - name: pagination
        in: query
        description: '"true" if pagination is required.'
        schema:
          type: boolean
      - name: per_page
        in: query
        description: 'Number of items to be returned par page. Default: 10.'
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: 'Page number to be displayed. Default: 1.'
        schema:
          type: integer
          format: int32
      - name: order_by
        in: query
        description: 'The name of the field based on which the returned list will be sorted. Default: dsn.'
        schema:
          type: string
      - name: order
        in: query
        description: 'Represents sorting direction: Ascending (asc) or descending (desc). Default: asc.'
        schema:
          type: string
      - name: delivery_option
        in: query
        description: Delivery option can be SYSTEM_PUSH or USER_CONSENT.
        schema:
          type: string
      - name: job_type
        in: query
        description: Job type can be OTA, FILE_TRANSFER, or SET_PROPERTY.
        schema:
          type: string
      - name: job_status
        in: query
        description: 'Status of the job. You can specify multiple statuses.<br>Possible values are: STARTED, STOPPED, or FAILED.'
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value:
                    total: 1
                    previous_page: null
                    next_page: null
                    current_page_number: 1
                    start_count_on_page: 1
                    end_count_on_page: 1
                    devices:
                      dsn: AC000W000340524
                      device_jobs:
                      - job_id: 5165
                        id: 9YpQxaXd
                        name: test-host-ota-job
                        job_type: OTA
                        delivery_option: SYSTEM_PUSH
                        started_at: 2020-07-16T00:00:14+0000
                        stopped_at: 2020-07-16T23:59:59+0000
                        last_modified_by: null
                        description: null
                        job_metadata: []
                        device_status: PROCESSING
                        job_status: STOPPED
                        fw_version: 6.9.0.07
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 1
                    default: 0
                  previous_page:
                    type: integer
                  next_page:
                    type: integer
                  current_page_number:
                    type: integer
                    example: 1
                    default: 0
                  start_count_on_page:
                    type: integer
                    example: 1
                    default: 0
                  end_count_on_page:
                    type: integer
                    example: 1
                    default: 0
                  devices:
                    type: object
                    properties:
                      dsn:
                        type: string
                        example: AC000W000340524
                      device_jobs:
                        type: array
                        items:
                          type: object
                          properties:
                            job_id:
                              type: integer
                              example: 5165
                              default: 0
                            id:
                              type: string
                              example: 9YpQxaXd
                            name:
                              type: string
                              example: test-host-ota-job
                            job_type:
                              type: string
                              example: OTA
                            delivery_option:
                              type: string
                              example: SYSTEM_PUSH
                            started_at:
                              type: string
                              example: 2020-07-16T00:00:14+0000
                            stopped_at:
                              type: string
                              example: 2020-07-16T23:59:59+0000
                            last_modified_by: {}
                            description: {}
                            job_metadata:
                              type: array
                              items:
                                type: object
                                properties: {}
                            device_status:
                              type: string
                              example: PROCESSING
                            job_status:
                              type: string
                              example: STOPPED
                            fw_version:
                              type: string
                              example: 6.9.0.07
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Users
      security:
      - sec0: []
    servers:
    - url: https://icc-dev.aylanetworks.com/icc/v1/
  /users/sign_in.json:
    post:
      summary: Sign In
      description: 'This API is used to sign a user into the Ayla IoT Cloud service. This API returns an access token and refresh token. The access token is required to use Ayla APIs. The refresh token can be used to obtain a new access token.


        To use this API, you need the user''s *email*, *password*, *app_id*, and *app_secret*.


        Follow these steps to get your *app_id* and *app_secret*:

        1. Log in to Alya Customer Dashboard.

        2. In the left navigation panel, click **OEM Profile**.

        3. Under the **Apps** tab, create a new app-id, or choose an existing app-id.'
      operationId: sign-in
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
                  format: json
            examples: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: 9aa1fba14a6e4e08903db05bd64efa00
                  refresh_token:
                    type: string
                    example: d6edfe5a76ea47b3b3ba3e6b02a7ac22
                  expires_in:
                    type: integer
                    example: 86400
                    default: 0
                  role:
                    type: string
                    example: EndUser
                  role_tags:
                    type: array
                    items:
                      type: object
                      properties: {}
              examples:
                OK:
                  summary: OK
                  value:
                    access_token: 9aa1fba14a6e4e08903db05bd64efa00
                    refresh_token: d6edfe5a76ea47b3b3ba3e6b02a7ac22
                    expires_in: 86400
                    role: EndUser
                    role_tags: []
          description: OK
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
      deprecated: false
      security: []
      tags:
      - Users
    servers:
    - url: https://user-dev.aylanetworks.com/
  /api/v1/users/assign_label.json:
    put:
      summary: Assign label
      description: 'This API assigns a role label to a user with the given role.**Note**: Either user_email or username is required.'
      operationId: assign-label
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - role
              properties:
                user_email:
                  type: string
                  description: Email of the user. Either *user_email* or *username* is required.
                username:
                  type: string
                  description: Username of the user. Either *user_email* or *username* is required.
                role:
                  type: string
                  description: User role.
                label:
                  properties:
                    name:
                      type: string
                      description: Label name.
                    value:
                      type: string
                      description: Label value.
                  required: []
                  type: object
                  description: Role label object
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Users
      security:
      - sec0: []
    servers:
    - url: https://user-dev.aylanetworks.com/
  /api/v1/users/assign_role.json:
    put:
      summary: Assign role
      description: 'This API assigns a role to an existing user.

        **Note**: user_email or username is required.'
      operationId: assign-role
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - role
              - oem
              - id
              properties:
                role:
                  type: string
                  description: Role of the user.
                oem:
                  type: string
                  description: OEM identifier. **Mandatory** if *user_email* is sent and *current_user* belongs to other OEM.
                id:
                  type: integer
                  description: Unique user identifier.
                  format: int32
                user_email:
                  type: string
                  description: Email of the user. *user_email* or *username* is required.
                username:
                  type: string
                  description: Username of the user. *user_email* or *username* is required.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Users
      security:
      - sec0: []
    servers:
    - url: https://user-dev.aylanetworks.com/
  /api/v1/users/associate_role_user.json:
    put:
      summary: Associate role user
      description: This API associates an end user with the specified role to the OEM.
      operationId: associate-role-user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - role
              - label
              properties:
                role:
                  type: string
                  description: Role user.
                label:
                  properties:
                    name:
                      type: string
                      description: Label name.
                    value:
                      type: string
                      description: Label value.
                  required:
                  - name
                  - value
                  type: object
                  description: User label.
                user_id:
                  type: string
                  description: User id of the role user. To use this parameter, OEM::Admin level privileges are required.
                user_email:
                  type: string
                  description: Email of the role user. To use this parameter, OEM::Admin level privileges are required.
                username:
                  type: string
                  description: Username of the role user. To use this parameter, OEM::Admin level privileges are required.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '401':
          content: {}
          description: Unauthorized
        '404':
          content: {}
          description: Not Found
        '422':
          content: {}
          description: Unprocessable Entity
      deprecated: false
      tags:
      - Users
      security:
      - sec0: []
