- breaking: false
  highlights:
  - Added the ability for OEM Support Managers to delete end users from the Dashboard, enabling them to manage end users directly.
  - Updated the default delivery stage for OTA jobs to "10, All Devices" instead of "All" to enable a staged rollout, allowing the OTA update
    to be validated on the first 10 devices before it is delivered to all devices.
  date: '2026-09-11'
