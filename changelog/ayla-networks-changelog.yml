  - Fixed an issue where a newly added device could continue showing an "Unknown" connection status instead of its actual status.
  date: '2026-09-11'
- breaking: false
  highlights:
  - Fixed an issue where some devices restarted repeatedly. Devices now remain connected and operate normally.
  date: '2026-09-11'
- breaking: false
  highlights:
  - Fixed an issue where users could not create a Legacy OTA job due to the Groups list failing to load.
  date: '2026-09-11'
- breaking: false
  highlights:
  - Fixed an issue where device shares were not automatically deleted when a user was deleted.
  - Fixed an issue where iOS users could not continue using the app after their session expired due to a session refresh failure.
  - Fixed an issue where users created with social login could not be found when searching by user ID.
  - Added audit logging for sensitive data operations to improve data protection and traceability.
  - Fixed an issue where users could not complete MFA login due to the MFA token not being created with the required expiry information.
  - Fixed an issue where users could not share a device with another user due to missing user information.
  - Optimized impersonation token handling to reuse the existing token instead of creating a new token for each request.
